<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Profile</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }

        /* LEFT COLUMN */
        .avatar-card { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; text-align: center; }
        .avatar-display { width: 250px; height: 300px; background: #fff; border: 1px inset #eee; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 80px; }

        /* SOCIAL BUTTONS */
        .social-btn { width: 100%; padding: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; border: 1px solid #888; border-radius: 3px; font-size: 12px; }
        .btn-friend { background: #007a3d; color: white; border-color: #005c2e; }
        .btn-msg { background: #f4f4f4; color: #333; }
        .btn-cancel { background: #ff9900; color: white; border-color: #cc7a00; }
        .btn-unfriend { background: #d92525; color: white; border-color: #a00; }
        .btn-disabled { background: #ccc !important; color: #666 !important; cursor: not-allowed; border-color: #999; }

        /* MODALS */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: white; border: 2px solid #000; z-index: 1000; padding: 20px; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 5px; box-sizing: border-box; resize: none; border: 1px solid #ccc; }

        /* CONTENT SECTIONS */
        .section-title { font-size: 14px; font-weight: bold; border-bottom: 1px solid #ccc; margin: 20px 0 10px; padding-bottom: 5px; color: #333; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge-icon { width: 65px; height: 75px; background: #f0f0f0; border: 1px solid #ccc; text-align: center; font-size: 9px; padding: 5px; border-radius: 4px; box-sizing: border-box; }
        .badge-emoji { font-size: 24px; display: block; margin-bottom: 2px; }

        .friends-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .friend-box { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; cursor: pointer; background: #fff; }

        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .item-slot { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; background: #fff; }
        .item-slot img { width: 50px; height: 50px; display: block; margin: 0 auto 5px; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay" onclick="closeMsg()"></div>
    <div class="modal" id="msg-modal">
        <h3 id="msg-title" style="margin-top:0;">Send Message</h3>
        <textarea id="msg-text" placeholder="Type a message..."></textarea>
        <button class="social-btn btn-friend" onclick="sendMessage()">Send</button>
        <button class="social-btn" onclick="closeMsg()">Cancel</button>
    </div>

    <div class="site-wrapper">
        <div class="header">PLAYER PROFILE</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a> | <a href="marketplace.html">Catalog</a> | <a href="inbox.html">Inbox</a>
        </div>

        <div class="profile-layout">
            <div class="left-col">
                <div class="avatar-card">
                    <div class="avatar-display">👤</div>
                    <div id="social-actions"></div>
                </div>
                <div class="section-title">Friends (<span id="friend-count">0</span>)</div>
                <div class="friends-grid" id="friends-list"></div>
            </div>

            <div class="right-col">
                <h1 id="p-username" style="margin:0;">Loading...</h1>
                <p id="p-id" style="font-size:11px; color:#999; margin: 5px 0 15px 0;">User ID: ---</p>
                <div class="section-title">Badges</div>
                <div class="badge-list" id="badge-ribbon"></div>
                <div class="section-title">Inventory</div>
                <div class="inv-grid" id="p-inv"></div>
            </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            me: localStorage.getItem("currentUser"),
            target: localStorage.getItem("profileTarget"),
            users: JSON.parse(localStorage.getItem("blypo_users") || "{}"),
            requests: JSON.parse(localStorage.getItem("blypo_requests") || "[]")
        };

        function initProfile() {
            const user = BLYPE.users[BLYPE.target];
            if (!user) return;

            document.getElementById('p-username').innerText = BLYPE.target;
            document.getElementById('p-id').innerText = "User ID: " + (user.id || "Unknown");
            document.getElementById('msg-title').innerText = "Message " + BLYPE.target;

            // --- SOCIAL BUTTON LOGIC ---
            const myFriends = BLYPE.users[BLYPE.me]?.friends || [];
            const actionDiv = document.getElementById('social-actions');
            
            const sentReq = BLYPE.requests.find(r => r.from === BLYPE.me && r.to === BLYPE.target);
            const gotReq = BLYPE.requests.find(r => r.from === BLYPE.target && r.to === BLYPE.me);

            if (BLYPE.me === BLYPE.target) {
                actionDiv.innerHTML = `<button class="social-btn btn-disabled">Your Profile</button>`;
            } 
            else if (myFriends.includes(BLYPE.target)) {
                actionDiv.innerHTML = `
                    <button class="social-btn btn-msg" onclick="openMsg()">Message</button>
                    <button class="social-btn btn-unfriend" onclick="unfriend()">Unfriend</button>
                `;
            } 
            else if (sentReq) {
                actionDiv.innerHTML = `
                    <button class="social-btn btn-msg" onclick="openMsg()">Message</button>
                    <button class="social-btn btn-cancel" onclick="cancelRequest()">Cancel Request</button>
                `;
            } 
            else if (gotReq) {
                actionDiv.innerHTML = `
                    <button class="social-btn btn-friend" onclick="window.location.href='inbox.html'">Accept Request</button>
                    <button class="social-btn btn-msg" onclick="openMsg()">Message</button>
                `;
            } 
            else {
                actionDiv.innerHTML = `
                    <button class="social-btn btn-friend" onclick="sendRequest()">Add Friend</button>
                    <button class="social-btn btn-msg" onclick="openMsg()">Message</button>
                `;
            }

            // --- RENDER FRIENDS & BADGES ---
            const fList = document.getElementById('friends-list');
            const friends = user.friends || [];
            document.getElementById('friend-count').innerText = friends.length;
            fList.innerHTML = friends.map(f => `<div class="friend-box" onclick="go('${f}')">👤<br>${f}</div>`).join('') || "No friends.";

            const ribbon = document.getElementById('badge-ribbon');
            let bHTML = "";
            if (user.isAdmin) bHTML += `<div class="badge-icon"><span class="badge-emoji">🛡️</span><b>Admin</b></div>`;
            if (friends.length >= 10) bHTML += `<div class="badge-icon"><span class="badge-emoji">🤝</span><b>Friendly</b></div>`;
            if ((user.inventory || []).length >= 5) bHTML += `<div class="badge-icon"><span class="badge-emoji">🛍️</span><b>Collector</b></div>`;
            ribbon.innerHTML = bHTML || "No badges.";

            const inv = document.getElementById('p-inv');
            inv.innerHTML = (user.inventory || []).map(item => {
                const img = item.replace(/\s+/g, '') + "Front.png";
                return `<div class="item-slot"><img src="${img}" onerror="this.src='https://via.placeholder.com/40'"><b>${item}</b></div>`;
            }).join('');
        }

        // --- CORE SOCIAL FUNCTIONS ---
        function sendRequest() {
            if (!BLYPE.me) return alert("Log in first!");
            BLYPE.requests.push({ from: BLYPE.me, to: BLYPE.target, status: "pending", id: Date.now() });
            localStorage.setItem("blypo_requests", JSON.stringify(BLYPE.requests));
            location.reload();
        }

        function cancelRequest() {
            let requests = JSON.parse(localStorage.getItem("blypo_requests") || "[]");
            requests = requests.filter(r => !(r.from === BLYPE.me && r.to === BLYPE.target));
            localStorage.setItem("blypo_requests", JSON.stringify(requests));
            location.reload();
        }

        function unfriend() {
            if (!confirm(`Unfriend ${BLYPE.target}?`)) return;
            BLYPE.users[BLYPE.me].friends = (BLYPE.users[BLYPE.me].friends || []).filter(f => f !== BLYPE.target);
            BLYPE.users[BLYPE.target].friends = (BLYPE.users[BLYPE.target].friends || []).filter(f => f !== BLYPE.me);
            localStorage.setItem("blypo_users", JSON.stringify(BLYPE.users));
            location.reload();
        }

        function openMsg() { 
            if (!BLYPE.me) return alert("Log in to message!");
            document.getElementById('msg-modal').style.display = 'block'; 
            document.getElementById('overlay').style.display = 'block'; 
        }

        function closeMsg() { 
            document.getElementById('msg-modal').style.display = 'none'; 
            document.getElementById('overlay').style.display = 'none'; 
        }

        function sendMessage() {
            const txt = document.getElementById('msg-text').value.trim();
            if (!txt) return;
            let msgs = JSON.parse(localStorage.getItem("blypo_messages") || "[]");
            msgs.push({ from: BLYPE.me, to: BLYPE.target, content: txt, date: new Date().toLocaleString() });
            localStorage.setItem("blypo_messages", JSON.stringify(msgs));
            alert("Message sent!");
            closeMsg();
        }

        function go(name) { localStorage.setItem("profileTarget", name); location.reload(); }

        window.onload = initProfile;
    </script>
</body>
</html>
