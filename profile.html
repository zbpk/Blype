<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Profile</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .profile-container { padding: 30px; display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
        
        /* LEFT COLUMN */
        .avatar-card { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; text-align: center; }
        .avatar-view { width: 250px; height: 300px; background: white; border: 1px inset #eee; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        
        /* RIGHT COLUMN */
        .info-box h1 { margin: 0; color: #333; font-size: 28px; }
        .status-box { background: #fffdf0; border: 1px solid #e6db55; padding: 10px; margin: 15px 0; font-style: italic; font-size: 13px; }
        
        .inventory-preview { margin-top: 20px; }
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .inv-item { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 9px; }
        .inv-item img { width: 40px; }

        .badge-admin { color: white; background: red; padding: 2px 5px; font-size: 10px; border-radius: 3px; vertical-align: middle; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">PLAYER PROFILE</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a> | <a href="forum.html">Forum</a>
        </div>

        <div class="profile-container">
            <div class="left-col">
                <div class="avatar-card">
                    <div class="avatar-view" id="p-avatar">👤</div>
                    <button class="btn" style="width:100%;">Add Friend</button>
                </div>
            </div>

            <div class="right-col">
                <div class="info-box">
                    <h1 id="p-username">User Profile <span id="p-badge"></span></h1>
                    <div class="status-box" id="p-status">"I'm new to BLYPEME!"</div>
                    
                    <p style="font-size: 12px;"><b>Blypo-Bux:</b> <span id="p-bux">0</span></p>
                    <p style="font-size: 12px;"><b>Join Date:</b> Jan 16, 2026</p>

                    <div class="inventory-preview">
                        <h3>Inventory</h3>
                        <div class="inv-grid" id="p-inv">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadProfile() {
            // 1. Who are we looking at? (Set by people.html or admin.html)
            const target = localStorage.getItem("profileTarget");
            const db = JSON.parse(localStorage.getItem("blypo_users") || "{}");
            
            if (!target || !db[target]) {
                document.body.innerHTML = "<h1>User not found!</h1><a href='index.html'>Go Home</a>";
                return;
            }

            const user = db[target];

            // 2. Fill the page
            document.getElementById('p-username').childNodes[0].nodeValue = target + " ";
            document.getElementById('p-bux').innerText = (user.bux || 0).toLocaleString();
            
            if (user.isAdmin) {
                document.getElementById('p-badge').innerHTML = '<span class="badge-admin">STAFF</span>';
            }

            // 3. Load Inventory Icons
            const invDiv = document.getElementById('p-inv');
            if (user.inventory && user.inventory.length > 0) {
                user.inventory.forEach(item => {
                    const imgName = item.replace(/\s+/g, '') + "Front.png";
                    invDiv.innerHTML += `
                        <div class="inv-item">
                            <img src="${imgName}" onerror="this.src='https://via.placeholder.com/40?text=Item'">
                            <br>${item}
                        </div>
                    `;
                });
            } else {
                invDiv.innerHTML = "<p style='font-size:11px; color:#999;'>No items in inventory.</p>";
            }
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
