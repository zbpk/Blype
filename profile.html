<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Profile</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }

        /* LEFT COLUMN */
        .avatar-card { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; text-align: center; margin-bottom: 20px; }
        .avatar-display { width: 250px; height: 300px; background: #fff; border: 1px inset #eee; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 80px; }

        /* BADGES SECTION */
        .section-title { font-size: 14px; font-weight: bold; border-bottom: 1px solid #ccc; margin: 20px 0 10px; padding-bottom: 5px; color: #333; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge-icon { 
            width: 60px; height: 65px; background: #eee; border: 1px solid #ccc; 
            text-align: center; font-size: 9px; padding-top: 5px; border-radius: 4px;
        }
        .badge-img { font-size: 24px; display: block; margin-bottom: 2px; }

        /* FRIENDS SECTION */
        .friends-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .friend-box { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; cursor: pointer; background: #fff; }
        .friend-box:hover { border-color: #005596; }
        .friend-img { width: 40px; height: 40px; background: #ddd; margin: 0 auto 5px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* INFO SECTION */
        .info-header h1 { margin: 0; font-size: 24px; }
        .status-box { background: #fffdf0; border: 1px solid #e6db55; padding: 10px; margin: 10px 0; font-style: italic; font-size: 13px; }
        
        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .item-slot { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; background: #fff; }
        .item-slot img { width: 50px; height: 50px; display: block; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>PLAYER PROFILE</span>
            <span style="font-size:12px;">BLYPEME ver 2.0</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a> | <a href="marketplace.html">Shop</a>
        </div>

        <div class="profile-layout">
            <div class="left-col">
                <div class="avatar-card">
                    <div class="avatar-display">👤</div>
                    <button style="width:100%; padding:8px; font-weight:bold; cursor:pointer;">Add Friend</button>
                </div>

                <div class="section-title">Friends (<span id="friend-count">0</span>)</div>
                <div class="friends-grid" id="friends-list">
                    </div>
            </div>

            <div class="right-col">
                <div class="info-header">
                    <h1 id="p-username">User</h1>
                    <div class="status-box" id="p-status">"Exploring BLYPEME!"</div>
                </div>

                <div class="section-title">Badges</div>
                <div class="badge-list" id="badge-ribbon">
                    </div>

                <div class="section-title">Inventory</div>
                <div class="inv-grid" id="p-inv">
                    </div>
            </div>
        </div>
    </div>

    <script>
        function loadProfile() {
            const target = localStorage.getItem("profileTarget");
            const db = JSON.parse(localStorage.getItem("blypo_users") || "{}");
            if (!target || !db[target]) return;

            const user = db[target];
            document.getElementById('p-username').innerText = target;
            
            // 1. RENDER INVENTORY
            const invGrid = document.getElementById('p-inv');
            invGrid.innerHTML = "";
            const itemsOwned = user.inventory ? user.inventory.length : 0;
            if(user.inventory) {
                user.inventory.forEach(item => {
                    const img = item.replace(/\s+/g, '') + "Front.png";
                    invGrid.innerHTML += `<div class="item-slot"><img src="${img}" onerror="this.src='https://via.placeholder.com/40'"><b>${item}</b></div>`;
                });
            }

            // 2. RENDER FRIENDS
            const friendsList = document.getElementById('friends-list');
            const friends = user.friends || []; // Assumes an array of names
            document.getElementById('friend-count').innerText = friends.length;
            friendsList.innerHTML = friends.length ? "" : "<p style='font-size:10px; color:#999;'>No friends yet.</p>";
            friends.forEach(fName => {
                friendsList.innerHTML += `
                    <div class="friend-box" onclick="viewOther('${fName}')">
                        <div class="friend-img">👤</div>
                        ${fName}
                    </div>`;
            });

            // 3. LIVE BADGE LOGIC
            const ribbon = document.getElementById('badge-ribbon');
            ribbon.innerHTML = "";

            const badges = [];
            // Admin Badge
            if (user.isAdmin) badges.push({ name: "Admin", img: "🛡️" });
            
            // Friend Badges
            if (friends.length >= 1000) badges.push({ name: "1K Friends", img: "👑" });
            else if (friends.length >= 10) badges.push({ name: "Friendly", img: "🤝" });

            // Store Item Badges
            if (itemsOwned >= 100) badges.push({ name: "Collector", img: "🛍️" });
            
            // Placeholder Badges (Simulated stats)
            if (user.visited) badges.push({ name: "Traveler", img: "🌎" });
            if (user.madePlace) badges.push({ name: "Builder", img: "🔨" });

            badges.forEach(b => {
                ribbon.innerHTML += `
                    <div class="badge-icon">
                        <span class="badge-img">${b.img}</span>
                        <b>${b.name}</b>
                    </div>`;
            });
        }

        function viewOther(name) {
            localStorage.setItem("profileTarget", name);
            location.reload();
        }

        window.onload = loadProfile;
    </script>
</body>
</html>
