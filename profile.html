<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Profile</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }

        /* LEFT COLUMN: AVATAR */
        .profile-card { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; text-align: center; }
        .avatar-display { 
            width: 250px; height: 320px; background: #fff; border: 1px inset #eee; 
            margin: 0 auto 15px; display: flex; align-items: center; justify-content: center;
            font-size: 80px; color: #ccc; overflow: hidden;
        }
        .avatar-display img { max-width: 90%; }

        /* RIGHT COLUMN: INFO */
        .info-section h1 { margin: 0; font-size: 24px; color: #333; }
        .user-id { font-size: 11px; color: #999; margin-bottom: 10px; }
        
        .status-marquee { 
            background: #fffdf0; border: 1px solid #e6db55; padding: 10px; 
            margin: 15px 0; font-style: italic; font-size: 13px; color: #444;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #f4f4f4; padding: 10px; border: 1px solid #ddd; font-size: 12px; }
        .stat-box b { color: #005596; }

        /* INVENTORY PREVIEW */
        .inventory-preview { border: 1px solid #ccc; padding: 15px; }
        .inventory-preview h3 { margin-top: 0; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .item-slot { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; background: #fff; }
        .item-slot img { width: 50px; height: 50px; display: block; margin: 0 auto 5px; }

        /* BADGES */
        .badge { padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: bold; color: white; margin-left: 10px; vertical-align: middle; }
        .admin-badge { background: #d92525; }
        .member-badge { background: #005596; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span id="page-title">PLAYER PROFILE</span>
            <span id="online-status" style="font-size: 12px; color: #00ff00;">● Online</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a> | <a href="forum.html">Forum</a> | <a href="games.html">Games</a>
        </div>

        <div class="profile-layout">
            <div class="left-col">
                <div class="profile-card">
                    <div class="avatar-display" id="avatar-render">👤</div>
                    <button style="width: 100%; padding: 10px; font-weight: bold; cursor: pointer;">Send Friend Request</button>
                    <button style="width: 100%; padding: 10px; margin-top: 5px; cursor: pointer;">Message Player</button>
                </div>
            </div>

            <div class="info-section">
                <h1 id="username-display">Loading... <span id="rank-badge"></span></h1>
                <div class="user-id">User ID: <span id="id-display">00000</span></div>

                <div class="status-marquee" id="status-display">
                    "This user hasn't set a status yet."
                </div>

                <div class="stats-grid">
                    <div class="stat-box">Blypo-Bux: <b id="bux-display">0</b></div>
                    <div class="stat-box">Join Date: <b>Jan 16, 2026</b></div>
                    <div class="stat-box">Forum Posts: <b>0</b></div>
                    <div class="stat-box">Place Visits: <b>0</b></div>
                </div>

                <div class="inventory-preview">
                    <h3>Inventory</h3>
                    <div class="item-grid" id="inventory-grid">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function initProfile() {
            // 1. Identify Target (Who are we looking at?)
            const targetName = localStorage.getItem("profileTarget");
            const db = JSON.parse(localStorage.getItem("blypo_users") || "{}");

            if (!targetName || !db[targetName]) {
                document.getElementById('username-display').innerText = "User Not Found";
                return;
            }

            const user = db[targetName];

            // 2. Load Text Data
            document.getElementById('username-display').childNodes[0].nodeValue = targetName + " ";
            document.getElementById('id-display').innerText = user.id || "N/A";
            document.getElementById('bux-display').innerText = (user.bux || 0).toLocaleString();

            // 3. Load Badge
            const badgeSpan = document.getElementById('rank-badge');
            if (user.isAdmin) {
                badgeSpan.className = "badge admin-badge";
                badgeSpan.innerText = "ADMINISTRATOR";
            } else {
                badgeSpan.className = "badge member-badge";
                badgeSpan.innerText = "MEMBER";
            }

            // 4. Load Inventory (Instruction-compliant logic)
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = "";

            if (user.inventory && user.inventory.length > 0) {
                user.inventory.forEach(itemName => {
                    const slot = document.createElement('div');
                    slot.className = "item-slot";
                    
                    // Logic: Strip spaces + Front.png (e.g., "Brown Shirt" -> "BrownShirtFront.png")
                    const imgFile = itemName.replace(/\s+/g, '') + "Front.png";
                    
                    slot.innerHTML = `
                        <img src="${imgFile}" onerror="this.src='https://via.placeholder.com/50/ccc/fff?text=Item'">
                        <b>${itemName}</b>
                    `;
                    grid.appendChild(slot);
                });
            } else {
                grid.innerHTML = "<p style='grid-column: span 4; font-size:11px; color:#999;'>This user's inventory is empty.</p>";
            }
        }

        // Live refresh if admin edits this user in another tab
        window.addEventListener('storage', (e) => {
            if (e.key === 'blypo_users') initProfile();
        });

        window.onload = initProfile;
    </script>
</body>
</html>
