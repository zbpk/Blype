<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Profile</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .profile-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }

        /* LEFT COLUMN */
        .avatar-card { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; text-align: center; }
        .avatar-display { width: 250px; height: 300px; background: #fff; border: 1px inset #eee; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 80px; }

        /* BUTTONS */
        .social-btn { width: 100%; padding: 10px; font-weight: bold; cursor: pointer; margin-top: 5px; border: 1px solid #888; border-radius: 3px; }
        .btn-friend { background: #007a3d; color: white; }
        .btn-msg { background: #f4f4f4; color: #333; }
        .btn-disabled { background: #ccc !important; cursor: not-allowed; }

        /* MODAL POPUP */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; background: white; border: 2px solid #000; z-index: 1000; padding: 20px; box-shadow: 5px 5px 0 rgba(0,0,0,0.2); }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 5px; box-sizing: border-box; }

        /* BADGES & FRIENDS (Existing Styles) */
        .section-title { font-size: 14px; font-weight: bold; border-bottom: 1px solid #ccc; margin: 20px 0 10px; padding-bottom: 5px; }
        .badge-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge-icon { width: 60px; height: 65px; background: #eee; border: 1px solid #ccc; text-align: center; font-size: 9px; padding-top: 5px; border-radius: 4px; }
        .friends-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .friend-box { border: 1px solid #eee; padding: 5px; text-align: center; font-size: 10px; cursor: pointer; background: #fff; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="overlay" onclick="closeMsg()"></div>
    <div class="modal" id="msg-modal">
        <h3 id="msg-title">Send Message to Bill</h3>
        <textarea id="msg-text" placeholder="Write your message..."></textarea>
        <button class="social-btn btn-friend" onclick="sendMessage()">Send Message</button>
        <button class="social-btn" onclick="closeMsg()">Cancel</button>
    </div>

    <div class="site-wrapper">
        <div class="header">PLAYER PROFILE</div>
        <div class="nav"><a href="index.html">Home</a> | <a href="people.html">People</a></div>

        <div class="profile-layout">
            <div class="left-col">
                <div class="avatar-card">
                    <div class="avatar-display">👤</div>
                    <div id="social-actions">
                        </div>
                </div>
                <div class="section-title">Friends (<span id="friend-count">0</span>)</div>
                <div class="friends-grid" id="friends-list"></div>
            </div>

            <div class="right-col">
                <h1 id="p-username">User</h1>
                <div class="section-title">Badges</div>
                <div class="badge-list" id="badge-ribbon"></div>
                <div class="section-title">Inventory</div>
                <div id="p-inv" style="display:grid; grid-template-columns: repeat(4,1fr); gap:10px;"></div>
            </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            viewer: localStorage.getItem("currentUser"),
            target: localStorage.getItem("profileTarget"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        function loadProfile() {
            const user = BLYPE.db[BLYPE.target];
            if (!user) return;

            document.getElementById('p-username').innerText = BLYPE.target;
            document.getElementById('msg-title').innerText = "Send Message to " + BLYPE.target;

            // 1. FRIENDS LIST & BUTTON LOGIC
            const viewerData = BLYPE.db[BLYPE.viewer] || {};
            const viewerFriends = viewerData.friends || [];
            const actionDiv = document.getElementById('social-actions');

            if (BLYPE.viewer === BLYPE.target) {
                actionDiv.innerHTML = `<button class="social-btn btn-disabled">Viewing Your Profile</button>`;
            } else if (viewerFriends.includes(BLYPE.target)) {
                actionDiv.innerHTML = `<button class="social-btn btn-disabled">✓ Friends</button>
                                       <button class="social-btn btn-msg" onclick="openMsg()">Message</button>`;
            } else {
                actionDiv.innerHTML = `<button class="social-btn btn-friend" onclick="addFriend()">Add Friend</button>
                                       <button class="social-btn btn-msg" onclick="openMsg()">Message</button>`;
            }

            // 2. RENDER FRIENDS
            const fList = document.getElementById('friends-list');
            const friends = user.friends || [];
            document.getElementById('friend-count').innerText = friends.length;
            fList.innerHTML = friends.map(f => `<div class="friend-box" onclick="go('${f}')">👤<br>${f}</div>`).join('');

            // 3. RENDER BADGES
            const ribbon = document.getElementById('badge-ribbon');
            let badgeHTML = "";
            if (user.isAdmin) badgeHTML += `<div class="badge-icon">🛡️<br>Admin</div>`;
            if (friends.length >= 10) badgeHTML += `<div class="badge-icon">🤝<br>Friendly</div>`;
            if ((user.inventory||[]).length >= 5) badgeHTML += `<div class="badge-icon">🛍️<br>Collector</div>`;
            ribbon.innerHTML = badgeHTML;

            // 4. RENDER INVENTORY
            const inv = document.getElementById('p-inv');
            inv.innerHTML = (user.inventory||[]).map(item => `
                <div style="border:1px solid #eee; text-align:center; font-size:10px; background:#fff;">
                    <img src="${item.replace(/\s+/g,'')}Front.png" onerror="this.src='https://via.placeholder.com/40'" width="40"><br>${item}
                </div>`).join('');
        }

        // SOCIAL FUNCTIONS
        function addFriend() {
            if (!BLYPE.viewer) return alert("Log in to add friends!");
            
            // Update Viewer's friends
            if (!BLYPE.db[BLYPE.viewer].friends) BLYPE.db[BLYPE.viewer].friends = [];
            BLYPE.db[BLYPE.viewer].friends.push(BLYPE.target);

            // Update Target's friends
            if (!BLYPE.db[BLYPE.target].friends) BLYPE.db[BLYPE.target].friends = [];
            BLYPE.db[BLYPE.target].friends.push(BLYPE.viewer);

            localStorage.setItem("blypo_users", JSON.stringify(BLYPE.db));
            alert("You are now friends with " + BLYPE.target + "!");
            location.reload();
        }

        function openMsg() { 
            if (!BLYPE.viewer) return alert("Log in to send messages!");
            document.getElementById('msg-modal').style.display = 'block'; 
            document.getElementById('overlay').style.display = 'block'; 
        }

        function closeMsg() { 
            document.getElementById('msg-modal').style.display = 'none'; 
            document.getElementById('overlay').style.display = 'none'; 
        }

        function sendMessage() {
            const text = document.getElementById('msg-text').value;
            if (!text) return;

            let inbox = JSON.parse(localStorage.getItem("blypo_messages") || "[]");
            inbox.push({
                from: BLYPE.viewer,
                to: BLYPE.target,
                content: text,
                date: new Date().toLocaleString()
            });

            localStorage.setItem("blypo_messages", JSON.stringify(inbox));
            alert("Message sent to " + BLYPE.target + "!");
            closeMsg();
        }

        function go(name) { localStorage.setItem("profileTarget", name); location.reload(); }

        window.onload = loadProfile;
    </script>
</body>
</html>
