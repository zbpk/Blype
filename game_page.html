<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Game Details</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; position: relative; }
        
        /* HEADER & NAV */
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        /* PLAY BUTTON */
        .play-section { background: #f4f4f4; border: 1px solid #ccc; padding: 20px; border-radius: 5px; text-align: center; }
        .play-btn { 
            background: #02b039; color: white; border: none; padding: 15px 0; 
            font-size: 28px; font-weight: bold; cursor: pointer; border-radius: 8px;
            box-shadow: 0 5px 0 #018029; transition: 0.1s; width: 100%;
            display: block; text-decoration: none;
        }

        /* FAKE LAUNCHER POPUP (The "Roblox" Style) */
        #launcher-overlay {
            display: none; /* Hidden by default */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .launcher-window {
            background: white; width: 450px; padding: 30px; border-radius: 10px;
            text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 2px solid #005596;
        }
        .loading-bar-bg { background: #ddd; height: 20px; width: 100%; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        #loading-bar-fill { background: #02b039; height: 100%; width: 0%; transition: width 0.1s linear; }
        
        /* Game content styles... */
        .game-container { padding: 20px; display: flex; gap: 30px; border-bottom: 1px solid #eee; }
        .game-left { width: 420px; }
        .game-screenshot { width: 400px; height: 250px; background: #333; display: flex; align-items: center; justify-content: center; font-size: 80px; color: white; border: 4px solid #000; }
        .game-title { font-size: 32px; font-weight: bold; margin: 0; color: #333; }
        .game-meta a { color: #005596; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="launcher-overlay">
        <div class="launcher-window">
            <h2 style="margin: 0; color: #005596;">BLYPEME</h2>
            <p id="launcher-status" style="margin: 10px 0;">Starting BLYPEME...</p>
            <div class="loading-bar-bg">
                <div id="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="site-wrapper">
        <div class="header">BLYPEME</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="catalog.html">Catalog</a>
        </div>

        <div class="game-container">
            <div class="game-left">
                <div id="display-emoji" class="game-screenshot">🎮</div>
            </div>
            <div class="game-right">
                <h1 id="display-title" class="game-title">Loading...</h1>
                <div class="game-meta">By <a href="#" id="creator-link" onclick="goToProfile(event)">Loading...</a></div>
                <div class="play-section">
                    <a href="#" class="play-btn" id="playLink" onclick="startFakeLaunch(event)">Play</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gameName = localStorage.getItem("gameTarget") || "Baseplate";
        const gameCreator = localStorage.getItem("gameCreator") || "BlypeMe";
        const currentUser = localStorage.getItem("currentUser") || "Guest";

        // Setup Page text
        window.onload = function() {
            document.getElementById('display-title').innerText = gameName;
            document.getElementById('creator-link').innerText = gameCreator;
        };

        // THE FAKE LOADING LOGIC
        function startFakeLaunch(e) {
            e.preventDefault();
            
            const overlay = document.getElementById('launcher-overlay');
            const fill = document.getElementById('loading-bar-fill');
            const status = document.getElementById('launcher-status');
            
            // 1. Show the popup
            overlay.style.display = "flex";
            
            // 2. Pick random time between 2000ms (2s) and 4000ms (4s)
            const duration = Math.floor(Math.random() * (4000 - 2000 + 1)) + 2000;
            const startTime = Date.now();

            // 3. Animate the bar
            const interval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const progress = (elapsed / duration) * 100;
                
                fill.style.width = progress + "%";
                
                if (progress >= 50) status.innerText = "Connecting to Server...";
                if (progress >= 85) status.innerText = "Almost there...";

                if (elapsed >= duration) {
                    clearInterval(interval);
                    finishLaunch();
                }
            }, 50);
        }

        function finishLaunch() {
            // 4. Trigger the actual game launch protocol
            const uri = `blypeme://launch?user=${currentUser}&game=${gameName}`;
            window.location.assign(uri);
            
            // 5. Hide the fake launcher after it triggers the game
            setTimeout(() => {
                document.getElementById('launcher-overlay').style.display = "none";
                document.getElementById('loading-bar-fill').style.width = "0%"; // Reset for next time
                document.getElementById('launcher-status').innerText = "Starting BLYPEME...";
            }, 1000);
        }

        function goToProfile(e) {
            e.preventDefault();
            localStorage.setItem("profileTarget", gameCreator);
            window.location.href = "profile.html";
        }
    </script>
</body>
</html>
