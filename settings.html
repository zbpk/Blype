<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Settings</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        .header { background: #444; color: white; padding: 15px; font-weight: bold; font-size: 18px; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .settings-container { padding: 30px; }
        .settings-section { border: 1px solid #ccc; padding: 20px; background: #fdfdfd; margin-bottom: 20px; }
        .settings-section h2 { font-size: 16px; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; color: #333; }
        
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 5px; color: #666; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; box-sizing: border-box; }
        
        .btn { padding: 10px 20px; background: #444; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #222; }
        .btn-save { background: #007a3d; }

        /* STAFF AREA */
        #staff-settings { border: 2px solid #d92525; display: none; background: #fff5f5; }
        .staff-tag { color: #d92525; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">ACCOUNT SETTINGS</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a> | <a href="settings.html"><b>Settings</b></a>
        </div>

        <div class="settings-container">
            <div class="settings-section">
                <h2>Account Info</h2>
                <label>Username (Cannot be changed)</label>
                <input type="text" id="set-username" disabled style="background:#f0f0f0;">
                
                <label>Change Password</label>
                <input type="password" id="set-password" placeholder="Enter new password...">
                
                <button class="btn btn-save" onclick="saveSettings()">Update Account</button>
            </div>

            <div class="settings-section">
                <h2>Site Preferences</h2>
                <label>Site Theme</label>
                <select id="set-theme" style="width:100%; padding:8px;">
                    <option value="classic">Classic Blue (2011)</option>
                    <option value="dark">Dark Mode</option>
                    <option value="retro">Old School Green</option>
                </select>
                <p style="font-size:10px; color:#999; margin-top:10px;">Note: Theme changes are saved to this browser session.</p>
            </div>

            <div id="staff-settings" class="settings-section">
                <span class="staff-tag">STAFF ONLY</span>
                <h2>Global System Toggles</h2>
                <label>Maintenance Mode</label>
                <button class="btn" onclick="toggleMaintenance()">Toggle Maintenance (Live)</button>
                <p style="font-size:10px; margin-top:5px;">This will affect what users see on the Home page.</p>
            </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            session: localStorage.getItem("currentUser"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        function initSettings() {
            if (!BLYPE.session) {
                alert("You must be logged in to view settings.");
                window.location.href = "index.html";
                return;
            }

            const userData = BLYPE.db[BLYPE.session];
            
            // Fill current data
            document.getElementById('set-username').value = BLYPE.session;
            document.getElementById('set-password').value = userData.password;

            // Show Admin section if applicable
            if (userData.isAdmin) {
                document.getElementById('staff-settings').style.display = "block";
            }
        }

        function saveSettings() {
            const newPass = document.getElementById('set-password').value.trim();
            
            if (newPass.length < 3) {
                return alert("Password is too short!");
            }

            // Update Database
            BLYPE.db[BLYPE.session].password = newPass;
            localStorage.setItem("blypo_users", JSON.stringify(BLYPE.db));

            alert("Settings saved successfully!");
        }

        function toggleMaintenance() {
            const current = localStorage.getItem("maint_mode") === "true";
            localStorage.setItem("maint_mode", !current);
            alert("Maintenance Mode is now: " + (!current ? "ON" : "OFF"));
            
            // Also update the Global Red Bar
            if (!current) {
                localStorage.setItem("globalAlert", "⚠️ SITE IS CURRENTLY UNDER MAINTENANCE ⚠️");
            } else {
                localStorage.setItem("globalAlert", "");
            }
        }

        window.onload = initSettings;
    </script>
</body>
</html>
