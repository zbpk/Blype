<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPE - Home</title>
    <style>
        body { background: linear-gradient(to bottom, #ade8ff 0%, #e0f7ff 100%); background-attachment: fixed; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); background: rgba(255, 255, 255, 0.5); }
        .banner-container { background: #fff; border-bottom: 1px solid #000; }
        .banner-img { width: 900px; display: block; }
        .sub-nav { background-color: #8a49a8; padding: 10px 0; color: white; font-size: 12px; text-align: center; border-bottom: 3px solid #5a2d6d; }
        .sub-nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; }
        .main-container { display: grid; grid-template-columns: 200px 1fr 200px; gap: 12px; padding: 15px; }
        .box { background: #ffffff; border: 1px solid #a4a4a4; padding: 10px; margin-bottom: 12px; }
        .box-header { background: linear-gradient(to bottom, #f9f9f9, #e9e9e9); border-bottom: 1px solid #a4a4a4; padding: 6px; font-size: 11px; font-weight: bold; margin: -10px -10px 10px -10px; color: #333; text-transform: uppercase; }
        .video-player { background: #000; height: 280px; position: relative; border: 2px solid #a4a4a4; display: flex; align-items: center; justify-content: center; }
        input { width: 90%; font-size: 11px; margin-bottom: 8px; border: 1px solid #777; padding: 3px; }
        .btn { background: #f2f2f2; border: 1px solid #777; font-size: 11px; padding: 4px 10px; cursor: pointer; }
        .play-btn { background: #0080ff; color: white; border: 1px solid #003366; padding: 10px 20px; font-weight: bold; cursor: pointer; }
        .footer { text-align: center; font-size: 10px; padding: 30px; border-top: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <div class="banner-container"><img src="Banner.png" class="banner-img"></div>
        <div class="sub-nav">
            <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="marketplace.html">Marketplace</a> | <a href="people.html">People</a> | <a href="forum.html">Forum</a> | <a href="news.html">News</a> | <a href="help.html">Help</a> | <a href="settings.html">Settings</a>
        </div>
        <div class="main-container">
            <aside>
                <div class="box">
                    <div class="box-header">Member Login</div>
                    <div id="auth-status" style="display:none; text-align:center; font-size:11px;">
                        Welcome, <b id="display-name"></b>!<br>
                        <span style="color:green">B$ <span id="user-bux">0</span></span><br>
                        <a href="admin.html" id="admin-link" style="color:red; display:none;">Admin Panel</a><br>
                        <button class="btn" onclick="logout()">Logout</button>
                    </div>
                    <div id="login-form">
                        <input type="text" id="user-input" placeholder="Name"><br>
                        <input type="password" id="pass-input" placeholder="Pass"><br>
                        <button class="btn" onclick="attemptLogin()">Login</button>
                    </div>
                </div>
                <div class="box"><div class="box-header">Users Chip Tray</div><div id="tray"></div></div>
            </aside>
            <main>
                <div class="box">
                    <div class="box-header">Featured Experience</div>
                    <div id="featured-game-area" style="display:flex; gap:10px;">
                        <div style="width:150px; height:100px; background:#333;"></div>
                        <div>
                            <h3 id="feat-title">Frozen Peak</h3>
                            <button class="play-btn">Play</button>
                        </div>
                    </div>
                </div>
                <div class="box"><div class="box-header">Latest News</div><div id="news-feed" style="font-size:11px;"></div></div>
            </main>
            <aside>
                <div class="box"><div class="box-header">BLYPE Facts</div><div id="facts-area" style="font-size:10px;"></div></div>
                <div class="box"><div class="box-header">Dev Tweets</div><div id="tweets-area" style="font-size:10px; font-style:italic;"></div></div>
            </aside>
        </div>
        <div class="footer">BLYPE Corporation © 2026</div>
    </div>

    <script>
        function attemptLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;
            if(u.toLowerCase()==="admin" && p==="1234") {
                localStorage.setItem("isAdmin", "true");
                localStorage.setItem("userName", "Admin");
                if(!localStorage.getItem("blypoBux")) localStorage.setItem("blypoBux", "500");
                location.reload();
            }
        }
        function logout() { localStorage.clear(); location.reload(); }

        window.onload = function() {
            if(localStorage.getItem("isAdmin")==="true") {
                document.getElementById('login-form').style.display='none';
                document.getElementById('auth-status').style.display='block';
                document.getElementById('display-name').innerText = "Admin";
                document.getElementById('user-bux').innerText = localStorage.getItem("blypoBux");
                document.getElementById('admin-link').style.display='block';
            }
            // Load Admin-controlled content
            document.getElementById('feat-title').innerText = localStorage.getItem("admin_featGame") || "Frozen Peak";
            document.getElementById('facts-area').innerText = localStorage.getItem("admin_facts") || "100 Tallyz = 10 Blypo-Bux";
            document.getElementById('tweets-area').innerText = localStorage.getItem("admin_tweet") || "@Admin_Krew: Welcome to BLYPE!";
            document.getElementById('news-feed').innerText = localStorage.getItem("admin_news") || "No recent news.";
        };
    </script>
</body>
</html>
