<script>
    // 1. ALWAYS use "blypo_users" as the master key
    let users = JSON.parse(localStorage.getItem("blypo_users") || "{}");
    let currentUser = localStorage.getItem("currentUser");

    function register() {
        const u = document.getElementById('user-in').value.trim();
        const p = document.getElementById('pass-in').value.trim();
        
        if (!u || !p) return alert("Please enter a username and password!");
        
        // Reload users from storage right before checking to prevent overwriting
        users = JSON.parse(localStorage.getItem("blypo_users") || "{}");

        if (users[u]) return alert("That username is already taken!");

        // Create the user object
        users[u] = { 
            password: p, 
            bux: 500, 
            isAdmin: (u.toLowerCase() === "admin"), 
            inventory: ["Brown Shirt"],
            id: Math.floor(Math.random() * 90000) + 10000
        };

        // SAVE TO THE MASTER KEY
        localStorage.setItem("blypo_users", JSON.stringify(users));
        
        alert("Account for " + u + " created! You can now log in.");
    }

    function login() {
        const u = document.getElementById('user-in').value.trim();
        const p = document.getElementById('pass-in').value.trim();
        
        // Reload fresh data
        users = JSON.parse(localStorage.getItem("blypo_users") || "{}");

        if (users[u] && users[u].password === p) {
            localStorage.setItem("currentUser", u);
            localStorage.setItem("isAdmin", users[u].isAdmin || "false");
            
            // Sync legacy bux key for Marketplace/Shop
            localStorage.setItem("blypoBux", users[u].bux);
            
            location.reload();
        } else {
            alert("Invalid Username or Password.");
        }
    }

    // This makes sure if the Admin changes Bill's Bux, the Home page updates instantly
    window.addEventListener('storage', (e) => {
        if (e.key === 'blypo_users') {
            users = JSON.parse(e.newValue || "{}");
            updateLiveUI();
        }
    });
</script>
