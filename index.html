<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Home</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; }
        .sub-nav { background-color: #8a49a8; padding: 8px 0; color: white; font-size: 11px; font-weight: bold; border-bottom: 1px solid #000; text-align:center; }
        .sub-nav a { color: white; text-decoration: none; margin: 0 10px; }
        .main-container { display: grid; grid-template-columns: 200px 1fr 200px; gap: 15px; padding: 20px 0; text-align: left; }
        .box { background: #f0f0f0; border: 1px solid #a4a4a4; margin-bottom: 15px; padding: 10px; font-size: 11px; }
        .box-header { background: #e9e9e9; border-bottom: 1px solid #a4a4a4; padding: 4px; font-weight: bold; margin: -10px -10px 10px -10px; }
        input { width: 85%; margin-bottom: 5px; font-size: 10px; }
        .btn { font-size: 10px; cursor: pointer; padding: 2px 8px; }
    </style>
</head>
<body>
<div class="site-wrapper">
    <div class="sub-nav" id="main-nav">
        <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="marketplace.html">Marketplace</a> | <a href="character.html">Character</a> | <a href="forum.html">Forum</a>
    </div>
    <div class="main-container">
        <aside>
            <div class="box">
                <div class="box-header">Member Login</div>
                <div id="out">Name<br><input type="text" id="u"><br>Pass<br><input type="password" id="p"><br><button onclick="login()">Login</button></div>
                <div id="in" style="display:none; text-align:center;">
                    Welcome, <b>Admin</b>!<br>
                    <span style="color:green; font-weight:bold;">B$ <span id="bux-disp">0</span></span><br>
                    <button onclick="localStorage.removeItem('isAdmin'); location.reload();">Logout</button>
                </div>
            </div>
        </aside>
        <main><div class="box"><div class="box-header">News</div>Welcome to BLYPEME!</div></main>
        <aside><div class="box"><div class="box-header">Facts</div>B$ 5B is a lot of money!</div></aside>
    </div>
</div>
<script>
    function formatBux(num) {
        num = parseInt(num);
        if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
        return num;
    }
    function login() {
        if(document.getElementById('u').value.toLowerCase() === 'admin' && document.getElementById('p').value === '1234') {
            localStorage.setItem("isAdmin", "true"); location.reload();
        }
    }
    window.onload = function() {
        if(localStorage.getItem("isAdmin") === "true") {
            document.getElementById('out').style.display='none';
            document.getElementById('in').style.display='block';
            document.getElementById('bux-disp').innerText = formatBux(localStorage.getItem("blypoBux") || 0);
            document.getElementById('main-nav').innerHTML += ' | <a href="admin.html" style="color:yellow">Admin</a>';
        }
    }
</script>
</body>
</html>
