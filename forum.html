<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Forum</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #00427a; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .forum-container { padding: 20px; }
        
        /* POST CREATOR */
        .post-box { border: 1px solid #ccc; background: #f9f9f9; padding: 15px; margin-bottom: 20px; }
        .post-box h3 { margin-top: 0; font-size: 14px; color: #00427a; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; }
        
        /* THREAD LIST */
        .thread-row { border-bottom: 1px solid #eee; padding: 10px; display: grid; grid-template-columns: 1fr 150px; transition: 0.2s; }
        .thread-row:hover { background: #f0f8ff; }
        .thread-info b { font-size: 14px; color: blue; cursor: pointer; }
        .thread-meta { font-size: 10px; color: #666; margin-top: 4px; }
        .author-name { font-weight: bold; color: #333; }
        
        /* BADGES */
        .mod-tag { background: red; color: white; font-size: 9px; padding: 1px 4px; border-radius: 2px; margin-left: 5px; }
        
        .btn { background: #00427a; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>COMMUNITY FORUM</span>
            <span id="user-status" style="font-size: 12px; font-weight: normal;">Not Logged In</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="marketplace.html">Marketplace</a> | <a href="forum.html"><b>Forum</b></a> | <a href="people.html">People</a>
        </div>

        <div class="forum-container">
            <div class="post-box" id="creator-ui">
                <h3>Create New Thread</h3>
                <input type="text" id="thread-title" placeholder="Thread Title...">
                <textarea id="thread-body" rows="3" placeholder="Write your post here..."></textarea>
                <button class="btn" id="post-btn" onclick="submitThread()">Post Thread</button>
                <p id="guest-msg" style="display:none; font-size:11px; color:red;">Only registered members can post!</p>
            </div>

            <div id="thread-list">
                </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            session: localStorage.getItem("currentUser"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        function initForum() {
            // Update Auth UI
            const status = document.getElementById('user-status');
            if (BLYPE.session) {
                status.innerHTML = `Logged in as: <b>${BLYPE.session}</b>`;
                document.getElementById('post-btn').disabled = false;
            } else {
                status.innerText = "Logged in as: Guest";
                document.getElementById('post-btn').disabled = true;
                document.getElementById('guest-msg').style.display = "block";
            }

            loadThreads();
        }

        function submitThread() {
            const title = document.getElementById('thread-title').value.trim();
            const body = document.getElementById('thread-body').value.trim();

            if (!title || !body) return alert("Fill in all fields!");

            // 1. Create the thread object
            const newThread = {
                title: title,
                body: body,
                author: BLYPE.session,
                isAdmin: BLYPE.db[BLYPE.session]?.isAdmin || false,
                date: new Date().toLocaleString()
            };

            // 2. Get existing threads and add new one to the TOP
            let threads = JSON.parse(localStorage.getItem("forum_threads") || "[]");
            threads.unshift(newThread);

            // 3. Save and Refresh
            localStorage.setItem("forum_threads", JSON.stringify(threads));
            
            document.getElementById('thread-title').value = "";
            document.getElementById('thread-body').value = "";
            loadThreads();
        }

        function loadThreads() {
            const list = document.getElementById('thread-list');
            const threads = JSON.parse(localStorage.getItem("forum_threads") || "[]");
            
            list.innerHTML = "<h3>Latest Threads</h3>";

            if (threads.length === 0) {
                list.innerHTML += "<p style='color:#999; font-size:12px;'>No threads yet. Be the first to post!</p>";
                return;
            }

            threads.forEach(t => {
                const tag = t.isAdmin ? '<span class="mod-tag">MOD</span>' : '';
                const row = document.createElement('div');
                row.className = "thread-row";
                row.innerHTML = `
                    <div class="thread-info">
                        <b>${t.title}</b>
                        <div class="thread-meta">
                            By <span class="author-name">${t.author}</span> ${tag} | ${t.date}
                        </div>
                        <p style="font-size:12px; color:#444; margin-top:8px;">${t.body}</p>
                    </div>
                    <div style="text-align:right; font-size:11px; color:#999; align-self:center;">
                        0 Replies
                    </div>
                `;
                list.appendChild(row);
            });
        }

        // Live update if a thread is posted from another tab
        window.addEventListener('storage', (e) => {
            if (e.key === 'forum_threads') loadThreads();
        });

        window.onload = initForum;
    </script>
</body>
</html>
