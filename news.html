<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - News</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #333; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .news-container { padding: 30px; }
        
        /* ADMIN POSTER */
        #admin-post-area { 
            background: #fff3f3; border: 2px dashed #d92525; padding: 15px; 
            margin-bottom: 30px; display: none; 
        }

        /* ARTICLE STYLING */
        .article { margin-bottom: 40px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .article-title { color: #d92525; font-size: 20px; font-weight: bold; margin-bottom: 5px; display: block; }
        .article-meta { font-size: 11px; color: #777; margin-bottom: 15px; }
        .article-body { font-size: 13px; line-height: 1.6; color: #333; }
        .article-img { width: 100%; height: 200px; background: #f0f0f0; margin-bottom: 15px; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #ccc; }

        .sidebar-title { font-size: 14px; font-weight: bold; border-bottom: 1px solid #ccc; margin-bottom: 10px; }
        .btn-post { background: #d92525; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>OFFICIAL NEWS</span>
            <span id="admin-badge" style="font-size:10px; color:#ff0000; display:none;">STAFF ACCESS</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="news.html"><b>News</b></a> | <a href="forum.html">Forum</a> | <a href="help.html">Help</a>
        </div>

        <div class="news-container">
            
            <div id="admin-post-area">
                <h3 style="margin-top:0; color:#d92525;">Create Official News Post</h3>
                <input type="text" id="news-title" placeholder="Article Headline...">
                <textarea id="news-content" rows="4" placeholder="Write the news here..."></textarea>
                <button class="btn-post" onclick="postNews()">Publish to Site</button>
            </div>

            <div id="news-feed">
                </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            session: localStorage.getItem("currentUser"),
            isAdmin: localStorage.getItem("isAdmin") === "true"
        };

        // Default News (if database is empty)
        const defaultNews = [
            {
                title: "Welcome to BLYPEME!",
                date: "January 15, 2026",
                author: "Admin_Krew",
                content: "We are officially in open development. Check out the Marketplace and the Forum to get started!"
            }
        ];

        function initNews() {
            // 1. Show Admin Tools if staff
            if (BLYPE.isAdmin) {
                document.getElementById('admin-post-area').style.display = "block";
                document.getElementById('admin-badge').style.display = "inline";
            }

            loadNews();
        }

        function postNews() {
            const title = document.getElementById('news-title').value.trim();
            const content = document.getElementById('news-content').value.trim();

            if (!title || !content) return alert("Article needs a headline and body!");

            const newArticle = {
                title: title,
                date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                author: BLYPE.session,
                content: content
            };

            let newsData = JSON.parse(localStorage.getItem("blypo_news") || "[]");
            newsData.unshift(newArticle);
            localStorage.setItem("blypo_news", JSON.stringify(newsData));

            // Clear inputs and reload
            document.getElementById('news-title').value = "";
            document.getElementById('news-content').value = "";
            loadNews();
        }

        function loadNews() {
            const feed = document.getElementById('news-feed');
            let newsData = JSON.parse(localStorage.getItem("blypo_news") || "[]");

            // Use defaults if nothing is posted yet
            if (newsData.length === 0) {
                newsData = defaultNews;
            }

            feed.innerHTML = "";

            newsData.forEach(post => {
                const article = document.createElement('div');
                article.className = "article";
                article.innerHTML = `
                    <div class="article-img">NEWS IMAGE</div>
                    <span class="article-title">${post.title}</span>
                    <div class="article-meta">Posted by <b>${post.author}</b> on ${post.date}</div>
                    <div class="article-body">${post.content}</div>
                `;
                feed.appendChild(article);
            });
        }

        window.onload = initNews;
    </script>
</body>
</html>
