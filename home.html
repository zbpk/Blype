<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blype | Build. Play. Eject.</title>
    <style>
        /* Retro-Modern Color Palette */
        :root {
            --blype-purple: #8a2be2;
            --glass-white: rgba(255, 255, 255, 0.1);
            --plastic-white: #f0f0f5;
            --neon-green: #39ff14;
            --eject-red: #ff4b2b;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: var(--plastic-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Glass Header */
        nav {
            width: 100%;
            background: rgba(138, 43, 226, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-white);
            padding: 15px 0;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a { color: white; margin: 0 15px; text-decoration: none; text-transform: uppercase; }

        /* The Main Layout Grid */
        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            margin-top: 30px;
        }

        /* Social Chip Tray */
        .chip-tray {
            background: var(--glass-white);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .friend-chip {
            background: rgba(0,0,0,0.3);
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--neon-green);
        }

        .eject-btn {
            background: var(--eject-red);
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            padding: 5px;
        }

        /* Game Discovery Area */
        .main-stage {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .featured-image {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 15px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--blype-purple);
        }

        .play-button {
            background: var(--neon-green);
            color: black;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-green);
            transition: 0.3s;
        }

        .play-button:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <nav>
        <a href="#">BlypeMe</a> | <a href="#">Arcade</a> | <a href="#">The Forge</a> | <a href="#">Help</a>
    </nav>

    <div class="container">
        <aside class="chip-tray">
            <h2 style="font-size: 18px; color: var(--blype-purple);">Link-Chip Tray</h2>
            <div class="friend-chip">
                <span>Player_One</span>
                <button class="eject-btn">EJECT</button>
            </div>
            <div class="friend-chip">
                <span>VibeMaster</span>
                <button class="eject-btn">EJECT</button>
            </div>
            <button style="width:100%; background:none; border: 1px dashed white; color: white; padding: 10px; border-radius: 8px; cursor: pointer;">+ Add New Link</button>
        </aside>

        <main class="main-stage">
            <h1>Featured: <span style="color: var(--neon-green);">Frozen Peak Obby</span></h1>
            <div class="featured-image">
                <p>[ Placeholder for Godot Game Preview ]</p>
            </div>
            <button class="play-button" onclick="alert('Launching Blype Engine...')">PLAY NOW</button>
        </main>
    </div>

</body>
</html>
