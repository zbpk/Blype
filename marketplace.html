<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Marketplace</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #d9a525; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .market-container { padding: 20px; }
        .market-controls { background: #f4f4f4; padding: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #ddd; }

        /* ITEM GRID */
        .item-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        
        .item-card { 
            border: 1px solid #ccc; padding: 10px; background: #fff; text-align: center; 
            transition: 0.2s; cursor: pointer;
        }
        .item-card:hover { border-color: #d9a525; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .item-thumb { 
            width: 120px; height: 120px; background: #fdfdfd; margin: 0 auto 10px; 
            display: flex; align-items: center; justify-content: center; border: 1px solid #eee;
        }
        .item-thumb img { max-width: 100%; max-height: 100%; }
        
        .item-name { font-weight: bold; font-size: 12px; color: #333; display: block; height: 30px; overflow: hidden; }
        .item-price { color: #007a3d; font-weight: bold; font-size: 13px; margin: 5px 0; display: block; }
        
        .buy-btn { 
            background: #d9a525; color: white; border: none; padding: 5px 10px; 
            font-size: 11px; font-weight: bold; cursor: pointer; width: 100%; 
        }
        .buy-btn:hover { background: #b0851d; }
        .owned-tag { color: #888; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>MARKETPLACE</span>
            <span id="user-bux-display" style="font-size: 12px; font-weight: normal;">B$: 0</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="marketplace.html"><b>Marketplace</b></a> | <a href="character.html">Character</a>
        </div>

        <div class="market-container">
            <div class="market-controls">
                <input type="text" id="market-search" placeholder="Search items..." style="padding:5px; width:200px;" onkeyup="filterItems()">
                <div style="font-size:11px;">Category: <b>All Clothing</b></div>
            </div>

            <div class="item-grid" id="catalog-feed">
                </div>
        </div>
    </div>

    <script>
        // MASTER DATABASE
        const BLYPE = {
            session: localStorage.getItem("currentUser"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        // Item Definition (The "Live" List)
        const items = [
            { name: "Brown Shirt", price: 50 },
            { name: "Blue Hoodie", price: 100 },
            { name: "Admin Cape", price: 500 },
            { name: "Golden Crown", price: 1000 },
            { name: "Green Varsity", price: 150 },
            { name: "Black Slacks", price: 20 }
        ];

        function initMarket() {
            if (BLYPE.session && BLYPE.db[BLYPE.session]) {
                document.getElementById('user-bux-display').innerText = "B$: " + BLYPE.db[BLYPE.session].bux.toLocaleString();
            }
            renderCatalog();
        }

        function renderCatalog() {
            const feed = document.getElementById('catalog-feed');
            feed.innerHTML = "";
            const userInventory = (BLYPE.session && BLYPE.db[BLYPE.session].inventory) ? BLYPE.db[BLYPE.session].inventory : [];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "item-card";
                
                // Filename logic: Remove spaces + "Front.png"
                const imgFile = item.name.replace(/\s+/g, '') + "Front.png";
                const isOwned = userInventory.includes(item.name);

                card.innerHTML = `
                    <div class="item-thumb">
                        <img src="${imgFile}" onerror="this.src='https://via.placeholder.com/100/eee/999?text=Item'">
                    </div>
                    <span class="item-name">${item.name}</span>
                    <span class="item-price">${item.price} B$</span>
                    ${isOwned ? '<span class="owned-tag">OWNED</span>' : `<button class="buy-btn" onclick="purchaseItem('${item.name}', ${item.price})">BUY</button>`}
                `;
                feed.appendChild(card);
            });
        }

        function purchaseItem(name, cost) {
            if (!BLYPE.session) return alert("You must be logged in to buy items!");

            let user = BLYPE.db[BLYPE.session];

            if (user.bux >= cost) {
                // Deduct Currency
                user.bux -= cost;
                
                // Add to Inventory
                if (!user.inventory) user.inventory = [];
                user.inventory.push(name);

                // Save to Master Database
                localStorage.setItem("blypo_users", JSON.stringify(BLYPE.db));
                
                // Update specific local keys for legacy support
                localStorage.setItem("blypoBux", user.bux);

                alert(`Successfully purchased ${name}!`);
                initMarket(); // Refresh view
            } else {
                alert("Insufficient B$ balance.");
            }
        }

        function filterItems() {
            const query = document.getElementById('market-search').value.toLowerCase();
            const cards = document.getElementsByClassName('item-card');
            for (let card of cards) {
                const name = card.querySelector('.item-name').innerText.toLowerCase();
                card.style.display = name.includes(query) ? "block" : "none";
            }
        }

        window.onload = initMarket;
    </script>
</body>
</html>
