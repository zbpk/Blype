<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLYPEME - Marketplace</title>
    <style>
        body {
            background: #ade8ff;
            font-family: 'Verdana', sans-serif;
            margin: 0; padding: 0;
            text-align: center;
        }

        .site-wrapper {
            width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.7);
            min-height: 100vh;
            border-left: 1px solid #000;
            border-right: 1px solid #000;
        }

        /* NAVIGATION */
        .sub-nav {
            background-color: #8a49a8;
            padding: 10px 0;
            color: white;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid #000;
        }
        .sub-nav a { color: white; text-decoration: none; margin: 0 10px; }
        .sub-nav a:hover { text-decoration: underline; }

        /* CURRENCY BAR */
        .balance-bar {
            background: #fff;
            padding: 12px;
            border-bottom: 1px solid #ccc;
            text-align: right;
            font-weight: bold;
            font-size: 13px;
        }

        /* MARKET GRID */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #a4a4a4;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.1s;
        }
        .item-card:hover { border-color: #8a49a8; }

        .item-img {
            width: 100%;
            height: 140px;
            background: #f7f7f7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
        }
        .item-img img { max-width: 100%; max-height: 100%; }

        .item-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; display: block; }
        .price-text { color: #27ae60; font-weight: bold; font-size: 12px; margin-bottom: 8px; display: block; }

        /* BUTTONS */
        .buy-btn {
            background: #72fb3c;
            border: 1px solid #27ae60;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .buy-btn:hover { background: #85ff5c; }

        .owned-label {
            background: #e0e0e0;
            border: 1px solid #999;
            color: #666;
            padding: 6px;
            font-size: 11px;
            font-weight: bold;
            display: block;
            text-align: center;
            cursor: default;
        }

        .footer { font-size: 9px; color: #666; padding: 40px; }
    </style>
</head>
<body>

<div class="site-wrapper">
    <div class="sub-nav">
        <a href="index.html">Home</a> | 
        <a href="games.html">Games</a> | 
        <a href="marketplace.html">Marketplace</a> | 
        <a href="character.html">Character</a> | 
        <a href="forum.html">Forum</a> |
        <a href="help.html">Help</a>
    </div>

    <div class="balance-bar">
        Your Balance: <span style="color:green;">B$ <span id="current-bux">0</span></span>
    </div>

    <div class="market-grid">
        
        <div class="item-card" id="item-brown-shirt">
            <div class="item-img"><img src="Brown Shirt Front.png" alt="Brown Shirt"></div>
            <span class="item-name">Brown Shirt</span>
            <span class="price-text">B$ 50</span>
            <div class="action-area">
                <button class="buy-btn" onclick="purchaseItem(50, 'brown-shirt', 'Brown Shirt')">Buy Now</button>
            </div>
        </div>

        <div class="item-card" id="item-admin-cape">
            <div class="item-img" style="background:#222; color:white; font-size:10px;">[ ADMIN ASSET ]</div>
            <span class="item-name">Admin Cape</span>
            <span class="price-text">B$ 5M</span>
            <div class="action-area">
                <button class="buy-btn" onclick="purchaseItem(5000000, 'admin-cape', 'Admin Cape')">Buy Now</button>
            </div>
        </div>

        <div class="item-card" id="item-gold-crown">
            <div class="item-img" style="background:#fff7e0; color:#d4af37; font-weight:bold;">CROWN</div>
            <span class="item-name">Golden Crown</span>
            <span class="price-text">B$ 500K</span>
            <div class="action-area">
                <button class="buy-btn" onclick="purchaseItem(500000, 'gold-crown', 'Golden Crown')">Buy Now</button>
            </div>
        </div>

        <div class="item-card" id="item-void-star">
            <div class="item-img" style="background:#000; color:#ff00ff;">VOID</div>
            <span class="item-name">The Void Star</span>
            <span class="price-text">B$ 5B</span>
            <div class="action-area">
                <button class="buy-btn" onclick="purchaseItem(5000000000, 'void-star', 'The Void Star')">Buy Now</button>
            </div>
        </div>

    </div>

    <div class="footer">
        BLYPEME Corporation © 2026. All items are virtual assets.
    </div>
</div>

<script>
    // --- SMART FORMATTING ENGINE ---
    function formatBux(num) {
        num = parseInt(num);
        if (isNaN(num)) return "0";
        if (num >= 1000000000000) return (num / 1000000000000).toFixed(1).replace(/\.0$/, '') + 'T';
        if (num >= 1000000000) return (num / 1000000000).toFixed(1).replace(/\.0$/, '') + 'B';
        if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
        return num.toString();
    }

    // --- PURCHASE SYSTEM ---
    function purchaseItem(cost, id, name) {
        let currentBux = parseInt(localStorage.getItem("blypoBux") || 0);

        if (currentBux >= cost) {
            // Deduct money
            currentBux -= cost;
            localStorage.setItem("blypoBux", currentBux);
            
            // Add to owned inventory
            let owned = JSON.parse(localStorage.getItem("ownedItems") || "[]");
            // Prevent duplicates in the array
            if (!owned.some(item => item.id === id)) {
                owned.push({id: id, name: name});
                localStorage.setItem("ownedItems", JSON.stringify(owned));
            }

            alert("Successfully purchased: " + name);
            renderMarketplace();
        } else {
            alert("Insufficient Blypo-Bux! You need B$ " + formatBux(cost - currentBux) + " more.");
        }
    }

    // --- UI RENDERER ---
    function renderMarketplace() {
        // Update top balance
        const rawBux = localStorage.getItem("blypoBux") || 0;
        document.getElementById('current-bux').innerText = formatBux(rawBux);

        // Update item buttons based on ownership
        let owned = JSON.parse(localStorage.getItem("ownedItems") || "[]");
        owned.forEach(item => {
            const card = document.getElementById('item-' + item.id);
            if (card) {
                const actionArea = card.querySelector('.action-area');
                actionArea.innerHTML = '<span class="owned-label">Owned</span>';
            }
        });
    }

    // Initialize on load
    window.onload = renderMarketplace;
</script>

</body>
</html>
