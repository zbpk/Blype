<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Marketplace</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: rgba(255,255,255,0.7); min-height: 100vh; }
        .sub-nav { background-color: #8a49a8; padding: 8px 0; color: white; text-align: center; border-bottom: 1px solid #000; font-size: 11px; font-weight: bold; }
        .sub-nav a { color: white; text-decoration: none; margin: 0 10px; }
        .balance-bar { background: #fff; padding: 10px; border-bottom: 1px solid #ccc; text-align: right; font-weight: bold; font-size: 12px; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 20px; }
        .item-card { background: #fff; border: 1px solid #ccc; padding: 10px; text-align: center; }
        .item-img { width: 100%; height: 120px; background: #eee; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
        .price-text { color: green; font-weight: bold; font-size: 12px; display: block; margin-bottom: 5px; }
        .buy-btn { background: #72fb3c; border: 1px solid #27ae60; padding: 5px 10px; font-weight: bold; cursor: pointer; width: 100%; }
        .owned-label { background: #ccc; border: 1px solid #999; color: #666; padding: 5px 10px; font-weight: bold; display: block; text-align: center; }
    </style>
</head>
<body>
<div class="site-wrapper">
    <div class="sub-nav">
        <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="marketplace.html">Marketplace</a> | <a href="character.html">Character</a> | <a href="shop.html">Shop</a>
    </div>
    <div class="balance-bar">Balance: <span style="color:green;">B$ <span id="current-bux">0</span></span></div>
    <div class="market-grid">
        <div class="item-card" id="item-brown-shirt">
            <div class="item-img"><img src="Brown Shirt Front.png" style="max-width:100%"></div>
            <b>Brown Shirt</b><br><span class="price-text">B$ 50</span>
            <div class="action-area"><button class="buy-btn" onclick="purchaseItem(50, 'brown-shirt', 'Brown Shirt')">Buy Now</button></div>
        </div>
        <div class="item-card" id="item-admin-cape">
            <div class="item-img" style="background:#444; color:#fff;">CAPE</div>
            <b>Admin Cape</b><br><span class="price-text">B$ 5M</span>
            <div class="action-area"><button class="buy-btn" onclick="purchaseItem(5000000, 'admin-cape', 'Admin Cape')">Buy Now</button></div>
        </div>
    </div>
</div>
<script>
    function formatBux(num) {
        num = parseInt(num);
        if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
        if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
        return num.toString();
    }
    function purchaseItem(cost, id, name) {
        let bux = parseInt(localStorage.getItem("blypoBux") || 0);
        if (bux >= cost) {
            localStorage.setItem("blypoBux", bux - cost);
            let owned = JSON.parse(localStorage.getItem("ownedItems") || "[]");
            owned.push({id: id, name: name});
            localStorage.setItem("ownedItems", JSON.stringify(owned));
            alert("Purchased!"); render();
        } else { alert("Not enough Blypo-Bux!"); }
    }
    function render() {
        document.getElementById('current-bux').innerText = formatBux(localStorage.getItem("blypoBux") || 0);
        let owned = JSON.parse(localStorage.getItem("ownedItems") || "[]");
        owned.forEach(item => {
            const card = document.getElementById('item-' + item.id);
            if (card) card.querySelector('.action-area').innerHTML = '<span class="owned-label">Owned</span>';
        });
    }
    window.onload = render;
</script>
</body>
</html>
