<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Inbox</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .content { padding: 20px; }
        .tab-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #005596; padding-bottom: 5px; color: #005596; }

        .box-item { border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; background: #f9f9f9; display: flex; justify-content: space-between; align-items: center; }
        .msg-content { flex-grow: 1; margin-right: 20px; }
        .msg-sender { font-weight: bold; color: #333; font-size: 13px; display: block; margin-bottom: 3px; }
        .msg-text { font-size: 12px; color: #444; font-style: italic; }
        .msg-date { font-size: 10px; color: #999; margin-top: 5px; }

        .btn { padding: 5px 12px; border: none; cursor: pointer; font-weight: bold; border-radius: 3px; font-size: 11px; }
        .btn-acc { background: #007a3d; color: white; }
        .btn-dec { background: #d92525; color: white; margin-left: 5px; }
        .btn-view { background: #005596; color: white; margin-bottom: 5px; }
        .btn-del { background: #888; color: white; }
        
        .action-group { display: flex; flex-direction: column; min-width: 90px; }
        .empty-hint { color: #999; font-style: italic; font-size: 12px; padding: 15px; text-align: center; border: 1px dashed #ccc; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">MY MESSAGES</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html">People</a>
        </div>

        <div class="content">
            <div class="tab-header">Friend Requests</div>
            <div id="request-list"></div>

            <br>

            <div class="tab-header">Inbox (Received)</div>
            <div id="message-list"></div>

            <br>

            <div class="tab-header">Sent Messages</div>
            <div id="sent-list"></div>
        </div>
    </div>

    <script>
        const BLYPE = {
            me: localStorage.getItem("currentUser"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        function loadInbox() {
            if (!BLYPE.me) return;
            const allMessages = JSON.parse(localStorage.getItem("blypo_messages") || "[]");
            const requests = JSON.parse(localStorage.getItem("blypo_requests") || "[]");

            // --- RENDER REQUESTS ---
            const myReqs = requests.filter(r => r.to === BLYPE.me);
            document.getElementById('request-list').innerHTML = myReqs.length ? myReqs.map(r => `
                <div class="box-item">
                    <div class="msg-content"><b>${r.from}</b> wants to be your friend!</div>
                    <div>
                        <button class="btn btn-acc" onclick="handleFriend('${r.from}', true)">Accept</button>
                        <button class="btn btn-dec" onclick="handleFriend('${r.from}', false)">Decline</button>
                    </div>
                </div>
            `).join('') : "<div class='empty-hint'>No pending requests.</div>";

            // --- RENDER RECEIVED MESSAGES ---
            const received = allMessages.filter(m => m.to === BLYPE.me);
            document.getElementById('message-list').innerHTML = received.length ? received.reverse().map(m => `
                <div class="box-item">
                    <div class="msg-content">
                        <span class="msg-sender">From: ${m.from}</span>
                        <div class="msg-text">"${m.content}"</div>
                        <div class="msg-date">${m.date}</div>
                    </div>
                    <div class="action-group">
                        <button class="btn btn-view" onclick="go('${m.from}')">Reply</button>
                        <button class="btn btn-del" onclick="deleteMsg('${m.date}')">Delete</button>
                    </div>
                </div>
            `).join('') : "<div class='empty-hint'>No messages received.</div>";

            // --- RENDER SENT MESSAGES ---
            const sent = allMessages.filter(m => m.from === BLYPE.me);
            document.getElementById('sent-list').innerHTML = sent.length ? sent.reverse().map(m => `
                <div class="box-item" style="background: #fdfdfd; border-left: 4px solid #005596;">
                    <div class="msg-content">
                        <span class="msg-sender">To: ${m.to}</span>
                        <div class="msg-text">"${m.content}"</div>
                        <div class="msg-date">${m.date}</div>
                    </div>
                    <div class="action-group">
                        <button class="btn btn-view" onclick="go('${m.to}')">Profile</button>
                        <button class="btn btn-del" onclick="deleteMsg('${m.date}')">Delete</button>
                    </div>
                </div>
            `).join('') : "<div class='empty-hint'>You haven't sent any messages yet.</div>";
        }

        function deleteMsg(dateId) {
            if (!confirm("Delete this message?")) return;
            let msgs = JSON.parse(localStorage.getItem("blypo_messages") || "[]");
            msgs = msgs.filter(m => m.date !== dateId);
            localStorage.setItem("blypo_messages", JSON.stringify(msgs));
            loadInbox();
        }

        function handleFriend(sender, approved) {
            let reqs = JSON.parse(localStorage.getItem("blypo_requests") || "[]");
            if (approved) {
                if (!BLYPE.db[BLYPE.me].friends) BLYPE.db[BLYPE.me].friends = [];
                if (!BLYPE.db[sender].friends) BLYPE.db[sender].friends = [];
                BLYPE.db[BLYPE.me].friends.push(sender);
                BLYPE.db[sender].friends.push(BLYPE.me);
                localStorage.setItem("blypo_users", JSON.stringify(BLYPE.db));
            }
            reqs = reqs.filter(r => !(r.from === sender && r.to === BLYPE.me));
            localStorage.setItem("blypo_requests", JSON.stringify(reqs));
            loadInbox();
        }

        function go(name) {
            localStorage.setItem("profileTarget", name);
            window.location.href = "profile.html";
        }

        window.onload = loadInbox;
    </script>
</body>
</html>
