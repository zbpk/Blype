<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - People</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #8a49a8; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .people-container { padding: 20px; }
        
        /* SEARCH & FILTER BAR */
        .search-area { 
            background: #f4f4f4; border: 1px solid #ccc; padding: 15px; 
            margin-bottom: 20px; display: flex; gap: 10px; align-items: center;
        }
        .search-area input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; }

        /* USER GRID */
        .people-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; 
        }
        
        .person-card { 
            border: 1px solid #ddd; padding: 15px; background: #fff; text-align: center; 
            cursor: pointer; transition: 0.2s;
        }
        .person-card:hover { border-color: #8a49a8; background: #fcfaff; transform: translateY(-2px); }
        
        .avatar-circle { 
            width: 80px; height: 80px; background: #eee; border-radius: 50%; 
            margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; border: 2px solid #ddd; overflow: hidden;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        
        .username { font-weight: bold; font-size: 13px; color: #333; display: block; }
        .user-status { font-size: 10px; color: #777; margin-top: 5px; }
        
        /* BADGES */
        .badge { font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 3px; margin-top: 5px; display: inline-block; }
        .admin-badge { background: #ff0000; color: white; }
        .member-badge { background: #005596; color: white; }

        .online-dot { 
            width: 10px; height: 10px; background: #00ff00; border-radius: 50%; 
            display: inline-block; margin-right: 5px; border: 1px solid #008800;
        }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>PEOPLE</span>
            <span id="total-count" style="font-size: 12px; font-weight: normal;">Total Users: 0</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="people.html"><b>People</b></a> | <a href="forum.html">Forum</a> | <a href="games.html">Games</a>
        </div>

        <div class="people-container">
            <div class="search-area">
                <input type="text" id="user-search" placeholder="Search for users..." onkeyup="renderPeople()">
                <select id="role-filter" onchange="renderPeople()" style="padding:7px;">
                    <option value="all">All Roles</option>
                    <option value="admin">Administrators</option>
                    <option value="member">Members</option>
                </select>
            </div>

            <div class="people-grid" id="people-list">
                </div>
        </div>
    </div>

    <script>
        function renderPeople() {
            // 1. Load the "Live" Database
            const users = JSON.parse(localStorage.getItem("blypo_users") || "{}");
            const list = document.getElementById('people-list');
            const searchQuery = document.getElementById('user-search').value.toLowerCase();
            const roleFilter = document.getElementById('role-filter').value;
            
            const usernames = Object.keys(users);
            document.getElementById('total-count').innerText = "Total Users: " + usernames.length;
            
            list.innerHTML = "";

            // 2. Loop through users and build cards
            usernames.forEach(name => {
                const data = users[name];
                
                // Search Filter Logic
                if (searchQuery && !name.toLowerCase().includes(searchQuery)) return;
                
                // Role Filter Logic
                if (roleFilter === "admin" && !data.isAdmin) return;
                if (roleFilter === "member" && data.isAdmin) return;

                const card = document.createElement('div');
                card.className = "person-card";
                card.onclick = () => viewProfile(name);
                
                const roleBadge = data.isAdmin 
                    ? '<span class="badge admin-badge">ADMIN</span>' 
                    : '<span class="badge member-badge">MEMBER</span>';

                card.innerHTML = `
                    <div class="avatar-circle">👤</div>
                    <span class="username"><span class="online-dot"></span>${name}</span>
                    ${roleBadge}
                    <div class="user-status">"Exploring BLYPEME!"</div>
                `;
                
                list.appendChild(card);
            });

            if (list.innerHTML === "") {
                list.innerHTML = "<p style='grid-column: span 4; text-align:center; color:#999;'>No users found.</p>";
            }
        }

        function viewProfile(username) {
            // Stores the name so profile.html knows who to load
            localStorage.setItem("profileTarget", username);
            window.location.href = "profile.html";
        }

        // Live update if someone registers in another tab
        window.addEventListener('storage', (e) => {
            if (e.key === 'blypo_users') renderPeople();
        });

        window.onload = renderPeople;
    </script>
</body>
</html>
