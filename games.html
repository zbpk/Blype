<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Games</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; font-size: 18px; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        /* CONTENT */
        .content { padding: 20px; }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; border-bottom: 2px solid #005596; padding-bottom: 5px; }

        /* GAMES GRID */
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        
        .game-card { 
            border: 1px solid #ccc; 
            padding: 10px; 
            background: #f9f9f9; 
            cursor: pointer; 
            transition: transform 0.1s, border-color 0.2s;
            text-align: center;
        }
        .game-card:hover { 
            border-color: #005596; 
            background: #f0f8ff; 
            transform: translateY(-2px);
        }

        .game-thumb { 
            width: 100%; 
            height: 140px; 
            background: #ddd; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 50px; 
            border: 1px solid #eee;
        }

        .game-info b { font-size: 14px; color: #333; }
        .game-info p { font-size: 11px; color: #666; margin: 5px 0 0 0; }

        .stats { font-size: 10px; color: #999; margin-top: 10px; display: flex; justify-content: space-around; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">GAMES</div>
        <div class="nav">
            <a href="index.html">Home</a> | 
            <a href="people.html">People</a> | 
            <a href="catalog.html">Catalog</a> | 
            <a href="inbox.html">Inbox</a>
        </div>

        <div class="content">
            <div class="section-title">Featured Experiences</div>
            
            <div class="games-grid">
                <div class="game-card" onclick="viewGame('Happy Home', 'Admin')">
                    <div class="game-thumb">🏠</div>
                    <div class="game-info">
                        <b>Happy Home</b>
                        <p>By Admin</p>
                    </div>
                    <div class="stats">
                        <span>Players: 12</span>
                        <span>👍 98%</span>
                    </div>
                </div>

                <div class="game-card" onclick="viewGame('Brick Battle', 'Bill')">
                    <div class="game-thumb">⚔️</div>
                    <div class="game-info">
                        <b>Brick Battle</b>
                        <p>By Bill</p>
                    </div>
                    <div class="stats">
                        <span>Players: 45</span>
                        <span>👍 92%</span>
                    </div>
                </div>

                <div class="game-card" onclick="viewGame('Baseplate', 'BlypeMe')">
                    <div class="game-thumb">🧱</div>
                    <div class="game-info">
                        <b>Baseplate</b>
                        <p>By BlypeMe</p>
                    </div>
                    <div class="stats">
                        <span>Players: 0</span>
                        <span>👍 100%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function viewGame(title, creator) {
            // Save details so the product page can load them
            localStorage.setItem("gameTarget", title);
            localStorage.setItem("gameCreator", creator);
            
            // Redirect to the middle page
            window.location.href = "game_page.html";
        }
    </script>
</body>
</html>
