<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Games</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        .header { background: #005596; color: white; padding: 15px; font-weight: bold; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }
        
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .game-card { border: 1px solid #ccc; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .game-card:hover { border-color: #005596; background: #f0f8ff; }
        .game-thumb { width: 100%; height: 120px; background: #ddd; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #777; }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <div class="header">GAMES</div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="catalog.html">Catalog</a>
        </div>
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Happy Home')">
                <div class="game-thumb">🏠</div>
                <b>Happy Home</b><br><span style="font-size:10px;">By Admin</span>
            </div>
            <div class="game-card" onclick="playGame('Brick Battle')">
                <div class="game-thumb">⚔️</div>
                <b>Brick Battle</b><br><span style="font-size:10px;">By Bill</span>
            </div>
        </div>
    </div>

    <script>
        function playGame(title) {
            localStorage.setItem("currentGame", title);
            window.location.href = "play.html";
        }
    </script>
</body>
</html>
