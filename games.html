<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPE - Games</title>
    <style>
        body { background: linear-gradient(to bottom, #ade8ff 0%, #e0f7ff 100%); background-attachment: fixed; font-family: 'Verdana', sans-serif; margin: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: rgba(255,255,255,0.8); min-height: 100vh; }
        .sub-nav { background-color: #8a49a8; padding: 10px 0; color: white; text-align: center; border-bottom: 3px solid #5a2d6d; }
        .sub-nav a { color: white; text-decoration: none; margin: 0 12px; font-weight: bold; font-size: 12px; }
        
        .games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; }
        .game-card { background: white; border: 1px solid #aaa; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .game-card:hover { border-color: #8a49a8; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .game-thumb { width: 100%; height: 120px; background: #333; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; }
        
        .play-btn { background: #0080ff; color: white; border: none; padding: 5px 15px; font-weight: bold; cursor: pointer; border-radius: 3px; }

        /* LOADING MODAL */
        #loading-screen { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 1000; color: white; text-align: center; padding-top: 20%;
        }
        .spinner { border: 8px solid #f3f3f3; border-top: 8px solid #8a49a8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h1 id="loading-game-name">Launching Game...</h1>
        <p>Connecting to BLYPE Servers...</p>
        <button onclick="document.getElementById('loading-screen').style.display='none'" style="margin-top:20px;">Cancel</button>
    </div>

    <div class="site-wrapper">
        <div class="sub-nav">
            <a href="index.html">Home</a> | <a href="games.html">Games</a> | <a href="marketplace.html">Marketplace</a> | <a href="people.html">People</a> | <a href="forum.html">Forum</a> | <a href="news.html">News</a> | <a href="help.html">Help</a> | <a href="settings.html">Settings</a>
        </div>

        <h2 style="padding: 20px; margin: 0;">Popular Experiences</h2>
        
        <div class="games-grid">
            <div class="game-card" onclick="playGame('Frozen Peak Obby')">
                <div class="game-thumb">FROZEN PEAK</div>
                <b>Frozen Peak Obby</b><br>
                <small>By ArcticBuilder</small><br><br>
                <button class="play-btn">Play</button>
            </div>

            <div class="game-card" onclick="playGame('Blype City RP')">
                <div class="game-thumb">CITY LIFE</div>
                <b>Blype City RP</b><br>
                <small>By MayorVibe</small><br><br>
                <button class="play-btn">Play</button>
            </div>

            <div class="game-card" onclick="playGame('Sword Fight HQ')">
                <div class="game-thumb">ARENA</div>
                <b>Sword Fight HQ</b><br>
                <small>By KnightBuild</small><br><br>
                <button class="play-btn">Play</button>
            </div>
        </div>
    </div>

    <script>
        function playGame(name) {
            document.getElementById('loading-game-name').innerText = "Launching " + name + "...";
            document.getElementById('loading-screen').style.display = 'block';
            setTimeout(() => {
                alert("This experience is currently under maintenance. Try again later!");
                document.getElementById('loading-screen').style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
