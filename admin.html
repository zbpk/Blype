<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Administrative Portal</title>
    <script>
        // Security Gate
        if (localStorage.getItem("isAdmin") !== "true") {
            window.location.replace("index.html");
        }
    </script>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: transparent; }
        
        /* Matching Navbar */
        .sub-nav {
            background-color: #8a49a8; padding: 8px 0; color: white;
            font-size: 11px; font-weight: bold; border-bottom: 1px solid #000; text-align: center;
        }
        .sub-nav a { color: white; text-decoration: none; margin: 0 10px; }

        .admin-container {
            display: grid; grid-template-columns: 250px 1fr; gap: 15px; padding: 20px 0; text-align: left;
        }

        /* Box Styling from your image */
        .box { background: #f0f0f0; border: 1px solid #a4a4a4; margin-bottom: 15px; padding: 10px; font-size: 11px; }
        .box-header {
            background: #e9e9e9; border-bottom: 1px solid #a4a4a4; padding: 4px;
            font-weight: bold; margin: -10px -10px 10px -10px; color: #333;
        }

        /* Forms */
        label { display: block; font-weight: bold; margin: 10px 0 3px 0; font-size: 10px; }
        input, textarea, select { width: 95%; font-family: 'Verdana'; font-size: 11px; border: 1px solid #777; padding: 3px; }
        .btn { padding: 4px 12px; font-size: 11px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-save { background: #72fb3c; border: 1px solid #27ae60; }
        .btn-danger { background: #ff4d4d; color: white; border: 1px solid #900; }

        .system-log {
            background: #fff; border: 1px solid #ccc; height: 100px; 
            overflow-y: scroll; font-family: monospace; padding: 5px; font-size: 10px;
        }
    </style>
</head>
<body>

<div class="site-wrapper">
    <div class="sub-nav">
        <a href="index.html">RETURN TO MAIN SITE</a> | <b>SYSTEM ADMINISTRATION MODE</b>
    </div>

    <div class="admin-container">
        <aside>
            <div class="box">
                <div class="box-header">User & Economy</div>
                <label>Target Character</label>
                <input type="text" id="target-user" value="Admin">
                
                <label>Adjust Blypo-Bux</label>
                <input type="number" id="bux-val" placeholder="Amount">
                <button class="btn btn-save" onclick="modBux(1)">Add</button>
                <button class="btn" onclick="modBux(-1)">Remove</button>
                
                <hr style="border:0; border-top:1px solid #ccc; margin: 10px 0;">
                
                <button class="btn btn-danger" style="width:100%" onclick="alert('User Banned')">Ban User</button>
                <button class="btn btn-danger" style="width:100%" onclick="alert('Posts Deleted')">Clear User Posts</button>
            </div>

            <div class="box">
                <div class="box-header">System Health</div>
                <div style="font-size: 10px;">
                    <b>Status:</b> <span style="color:green">Online</span><br>
                    <b>Users:</b> 1,402<br>
                    <b>Server Time:</b> Jan 16, 2026
                </div>
            </div>
        </aside>

        <main>
            <div class="box">
                <div class="box-header">Homepage Content Engine</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Featured Game Title</label>
                        <input type="text" id="feat-title-in">
                        
                        <label>Sidebar Facts</label>
                        <textarea id="facts-in" rows="4"></textarea>
                    </div>
                    <div>
                        <label>Dev Tweet (Krew's Korner)</label>
                        <input type="text" id="tweet-in">
                        
                        <label>Recent News Feed</label>
                        <textarea id="news-in" rows="4"></textarea>
                    </div>
                </div>
                <button class="btn btn-save" style="width:100%; height:30px; margin-top:15px;" onclick="pushLive()">UPDATE BLYPEME FRONT PAGE</button>
            </div>

            <div class="box">
                <div class="box-header">Marketplace & Forum Admin</div>
                <button class="btn">Add Marketplace Item</button>
                <button class="btn">Add Forum Category</button>
                <button class="btn">New Blog Post</button>
                <button class="btn btn-danger" onclick="localStorage.clear(); location.reload();">RESET ENTIRE DATABASE</button>
            </div>

            <div class="box">
                <div class="box-header">Administrative Logs</div>
                <div class="system-log" id="logs">
                    [18:50] Admin session started...<br>
                    [18:51] Security check passed...<br>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    function modBux(dir) {
        let val = parseInt(document.getElementById('bux-val').value) * dir;
        let current = parseInt(localStorage.getItem("blypoBux") || 0);
        localStorage.setItem("blypoBux", current + val);
        addLog(`Modified B$ for Admin: ${val}`);
        alert("Balance Updated!");
    }

    function pushLive() {
        localStorage.setItem("admin_featGame", document.getElementById('feat-title-in').value);
        localStorage.setItem("admin_facts", document.getElementById('facts-in').value);
        localStorage.setItem("admin_news", document.getElementById('news-in').value);
        localStorage.setItem("admin_tweet", document.getElementById('tweet-in').value);
        addLog("Pushed new content to homepage.");
        alert("Changes are now Live!");
    }

    function addLog(msg) {
        const div = document.getElementById('logs');
        div.innerHTML += `[${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}] ${msg}<br>`;
        div.scrollTop = div.scrollHeight;
    }

    window.onload = function() {
        document.getElementById('feat-title-in').value = localStorage.getItem("admin_featGame") || "Frozen Peak Obby";
        document.getElementById('facts-in').value = localStorage.getItem("admin_facts") || "";
        document.getElementById('news-in').value = localStorage.getItem("admin_news") || "";
        document.getElementById('tweet-in').value = localStorage.getItem("admin_tweet") || "";
    };
</script>

</body>
</html>
