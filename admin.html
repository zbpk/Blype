<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Super Admin Console</title>
    <script>
        // Security Gate
        if (localStorage.getItem("isAdmin") !== "true") window.location.replace("index.html");
    </script>
    <style>
        :root {
            --classic-grey: #d4d0c8;
            --classic-dark: #808080;
            --win-blue: #000080;
        }

        body { background: #3a6ea5; font-family: 'Tahoma', sans-serif; margin: 0; padding: 20px; }
        
        /* THE "WINDOW" LOOK */
        .window { 
            width: 900px; margin: 0 auto; background: var(--classic-grey); 
            border: 2px solid #fff; border-right-color: #404040; border-bottom-color: #404040;
            box-shadow: 2px 2px 0 #000;
        }
        .title-bar { 
            background: var(--win-blue); color: white; padding: 4px; font-weight: bold; 
            font-size: 13px; display: flex; justify-content: space-between; align-items: center;
        }
        .close-btn { background: var(--classic-grey); border: 1px solid #fff; width: 16px; height: 14px; color: #000; font-size: 9px; text-align: center; line-height: 12px; cursor: pointer; }

        .menu-bar { padding: 4px; border-bottom: 1px solid var(--classic-dark); font-size: 11px; }
        .menu-bar span { margin-right: 15px; cursor: pointer; }

        /* CONTENT GRID */
        .layout { display: grid; grid-template-columns: 250px 1fr; gap: 10px; padding: 10px; }

        /* PLAYER LIST BOX */
        .player-box { background: #fff; border: 2px inset #eee; height: 400px; overflow-y: scroll; padding: 5px; }
        .player-item { padding: 5px; border-bottom: 1px solid #eee; font-size: 12px; display: flex; justify-content: space-between; }
        .player-item:hover { background: #000080; color: white; cursor: pointer; }

        /* COMMAND PANEL */
        .control-panel { background: #fff; border: 2px inset #eee; padding: 15px; text-align: left; }
        
        h3 { margin-top: 0; font-size: 14px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
        .cmd-group { margin-bottom: 20px; }
        .cmd-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }

        /* CLASSIC BUTTONS */
        button { 
            background: var(--classic-grey); border: 2px solid #fff; border-right-color: #404040; 
            border-bottom-color: #404040; padding: 4px 10px; font-size: 11px; cursor: pointer;
        }
        button:active { border: 2px inset #404040; padding: 5px 9px 3px 11px; }
        .btn-red { color: #800000; font-weight: bold; }

        input { border: 2px inset #eee; padding: 4px; font-size: 11px; width: 100%; box-sizing: border-box; }

        .status-bar { border-top: 1px solid var(--classic-dark); padding: 3px; font-size: 11px; background: var(--classic-grey); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <span>BLYPEME Admin Console (Logged in as: ADMIN)</span>
        <div class="close-btn" onclick="window.location.href='index.html'">X</div>
    </div>
    
    <div class="menu-bar">
        <span>File</span> <span>Edit</span> <span>Database</span> <span onclick="refreshPlayers()">Refresh_Players</span> <span style="color:red" onclick="toggleSlock()">[SLOCK: OFF]</span>
    </div>

    <div class="layout">
        <div class="player-box" id="player-list">
            </div>

        <div class="control-panel">
            <div class="cmd-group">
                <h3>Selected Target: <span id="target-name" style="color:blue;">None</span></h3>
                <input type="text" id="custom-reason" placeholder="Action Reason (Ban/Kick/Warning)...">
                
                <div class="cmd-row">
                    <button class="btn-red" onclick="modAction('ban')">BAN</button>
                    <button class="btn-red" onclick="modAction('kick')">KICK</button>
                    <button onclick="modAction('warn')">WARN</button>
                    <button onclick="modAction('kill')">KILL</button>
                    <button onclick="modAction('respawn')">RESPAWN</button>
                </div>
            </div>

            <div class="cmd-group">
                <h3>Visual Effects (Aesthetics)</h3>
                <div class="cmd-row">
                    <button onclick="effect('fire')">FIRE</button>
                    <button onclick="effect('sparkles')">SPARKLES</button>
                    <button onclick="effect('smoke')">SMOKE</button>
                    <button onclick="effect('ff')">FORCEFIELD</button>
                    <button onclick="effect('unff')">REMOVE ALL</button>
                </div>
            </div>

            <div class="cmd-group">
                <h3>Asset Injection</h3>
                <div class="cmd-row">
                    <button onclick="giveAsset('B$ 1000')">GIVE 1K B$</button>
                    <button onclick="giveAsset('Admin Cape')">GIVE CAPE</button>
                    <button onclick="giveAsset('Crown')">GIVE CROWN</button>
                </div>
            </div>

            <div class="cmd-group">
                <h3>Global Message</h3>
                <input type="text" id="m-text" placeholder="Message text...">
                <div class="cmd-row">
                    <button style="width:100%" onclick="sendGlobal()">ANNOUNCE TO SERVER</button>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <span id="sys-status">Ready.</span>
        <span id="user-count">Users: 0</span>
    </div>
</div>

<script>
    let selectedUser = "";

    function refreshPlayers() {
        const users = JSON.parse(localStorage.getItem("blypo_users") || "{}");
        const list = document.getElementById('player-list');
        list.innerHTML = "";
        let count = 0;

        for (let u in users) {
            count++;
            const div = document.createElement('div');
            div.className = "player-item";
            div.innerHTML = `<span>${u}</span> <span style="font-size:9px; color:gray;">B$: ${users[u].bux}</span>`;
            div.onclick = () => selectUser(u);
            list.appendChild(div);
        }
        document.getElementById('user-count').innerText = "Users: " + count;
    }

    function selectUser(name) {
        selectedUser = name;
        document.getElementById('target-name').innerText = name;
        setStatus(`Focused on user: ${name}`);
    }

    function setStatus(msg) {
        document.getElementById('sys-status').innerText = msg;
    }

    function modAction(type) {
        if(!selectedUser) return alert("Select a player first!");
        
        if(type === 'ban') {
            let blacklist = JSON.parse(localStorage.getItem("blypo_blacklist") || "[]");
            if(!blacklist.includes(selectedUser)) {
                blacklist.push(selectedUser);
                localStorage.setItem("blypo_blacklist", JSON.stringify(blacklist));
                setStatus(`TERMINATED: ${selectedUser}`);
            }
        } else {
            setStatus(`CMD: ${type.toUpperCase()} executed on ${selectedUser}`);
        }
        alert(`Command [${type}] sent to server for ${selectedUser}`);
    }

    function effect(type) {
        if(!selectedUser) return alert("Select a player!");
        setStatus(`VISUAL: Applied ${type} to ${selectedUser}`);
    }

    function giveAsset(item) {
        if(!selectedUser) return alert("Select a player!");
        setStatus(`ECONOMY: Granted ${item} to ${selectedUser}`);
    }

    function sendGlobal() {
        const msg = document.getElementById('m-text').value;
        localStorage.setItem("globalAlert", msg);
        setStatus("GLOBAL: Announcement sent.");
    }

    function toggleSlock() {
        alert("SERVER LOCK (SLOCK) ACTIVATED. No new players can join.");
        setStatus("SYSTEM: Server is now locked.");
    }

    window.onload = refreshPlayers;
</script>

</body>
</html>
