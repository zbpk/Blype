<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Console</title>
    <script>
        if (localStorage.getItem("isAdmin") !== "true") window.location.replace("index.html");
    </script>
    <style>
        :root {
            --god-black: #050505; --god-gold: #ffd700; --god-red: #ff3333;
            --god-blue: #008cff; --god-green: #00ff44;
        }

        body { background: #111; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; color: #eee; }
        .site-wrapper { width: 1100px; margin: 0 auto; border: 2px solid var(--god-gold); background: #1a1a1a; min-height: 100vh; }
        
        /* HEADER */
        .admin-header { background: var(--god-black); padding: 25px; border-bottom: 3px solid var(--god-gold); }
        .admin-header h1 { margin: 0; font-size: 28px; color: var(--god-gold); text-shadow: 0 0 10px var(--god-gold); }

        .sub-nav { background: #222; padding: 12px; font-size: 12px; display: flex; justify-content: space-between; }
        .sub-nav a { color: var(--god-blue); text-decoration: none; font-weight: bold; }

        /* ACCORDION */
        .admin-section { border: 1px solid #333; margin: 15px 20px; background: #252525; }
        .dropdown-header {
            background: #333; padding: 15px; font-weight: bold; cursor: pointer;
            display: flex; justify-content: space-between; color: var(--god-gold);
            border-bottom: 1px solid #444;
        }
        .content { display: none; padding: 25px; background: #1e1e1e; }
        .content.active { display: block; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        input, textarea, select { background: #000; color: var(--god-green); border: 1px solid #444; padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 15px; }

        .btn { padding: 12px; border: none; font-weight: bold; cursor: pointer; border-radius: 2px; text-transform: uppercase; width: 100%; }
        .btn-gold { background: var(--god-gold); color: #000; }
        .btn-blue { background: var(--god-blue); color: #fff; }

        .console { background: #000; color: var(--god-green); padding: 15px; font-size: 11px; height: 120px; overflow-y: scroll; border: 1px solid #333; margin: 20px; }
    </style>
</head>
<body>

<div class="site-wrapper">
    <div class="admin-header">
        <h1>ADMIN CONSOLE</h1>
        <div style="font-size:11px; color:#666;">KERNEL_ACCESS: LEVEL_10 | DATABASE: BLYPEME_PROD</div>
    </div>

    <div class="sub-nav">
        <a href="index.html">← RETURN TO SITE</a>
        <div id="clock">00:00:00</div>
    </div>

    <div class="admin-section">
        <div class="dropdown-header" onclick="toggle(this)">📦 ITEM & ASSET INJECTION <span>[+]</span></div>
        <div class="content">
            <div class="grid-2">
                <div>
                    <label>Target Username</label>
                    <input type="text" id="target-player" placeholder="Enter username...">
                    
                    <label>Select Item to Grant</label>
                    <select id="item-to-give">
                        <option value="brown-shirt|Brown Shirt">Brown Shirt (Common)</option>
                        <option value="gold-crown|Golden Crown">Golden Crown (Legendary)</option>
                        <option value="void-star|The Void Star">The Void Star (Artifact)</option>
                        <option value="admin-cape|Admin Cape">Admin Cape (Dev-Only)</option>
                        <option value="ban-hammer|Ban Hammer">Ban Hammer (God-Item)</option>
                    </select>
                    <button class="btn btn-gold" onclick="injectItem()">INJECT ITEM TO INVENTORY</button>
                </div>
                <div>
                    <label>Quick B$ Gift</label>
                    <input type="number" id="quick-bux" placeholder="Amount...">
                    <button class="btn btn-blue" onclick="giftBux()">GRANT CURRENCY</button>
                </div>
            </div>
        </div>
    </div>

    <div class="admin-section">
        <div class="dropdown-header" onclick="toggle(this)">🌐 SITE-WIDE COMMANDS <span>[+]</span></div>
        <div class="content">
            <label>Site Broadcast</label>
            <input type="text" id="alert-msg" placeholder="Warning: Server restart in 5 minutes...">
            <button class="btn btn-blue" onclick="broadcast()">SEND ALERT</button>
        </div>
    </div>

    <div class="console" id="log">SYSTEM READY...</div>
</div>

<script>
    function toggle(header) {
        const content = header.nextElementSibling;
        content.classList.toggle('active');
        header.querySelector('span').innerText = content.classList.contains('active') ? '[-]' : '[+]';
    }

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML += `<br>> ${msg}`;
        l.scrollTop = l.scrollHeight;
    }

    // --- ITEM INJECTION LOGIC ---
    function injectItem() {
        const target = document.getElementById('target-player').value.trim();
        const itemData = document.getElementById('item-to-give').value.split('|');
        const itemId = itemData[0];
        const itemName = itemData[1];

        if (!target) return alert("Identify target user.");

        let users = JSON.parse(localStorage.getItem("blypo_users") || "{}");

        if (users[target]) {
            // Check for inventory property, create if missing
            if (!users[target].inventory) users[target].inventory = [];
            
            // Add item if they don't have it
            if (!users[target].inventory.some(i => i.id === itemId)) {
                users[target].inventory.push({id: itemId, name: itemName});
                localStorage.setItem("blypo_users", JSON.stringify(users));
                
                // If it's you, update current session inventory too
                if (localStorage.getItem("currentUser") === target) {
                    let myItems = JSON.parse(localStorage.getItem("ownedItems") || "[]");
                    myItems.push({id: itemId, name: itemName});
                    localStorage.setItem("ownedItems", JSON.stringify(myItems));
                }
                
                log(`INJECTOR: Granted [${itemName}] to user ${target}.`);
                alert(`Successfully injected ${itemName}!`);
            } else {
                alert("User already owns this item.");
            }
        } else {
            alert("Player not found in database.");
        }
    }

    function giftBux() {
        const target = document.getElementById('target-player').value.trim();
        const amt = parseInt(document.getElementById('quick-bux').value);
        if(!target || isNaN(amt)) return alert("Invalid Input.");

        let users = JSON.parse(localStorage.getItem("blypo_users") || "{}");
        if(users[target]) {
            users[target].bux += amt;
            localStorage.setItem("blypo_users", JSON.stringify(users));
            if(localStorage.getItem("currentUser") === target) localStorage.setItem("blypoBux", users[target].bux);
            log(`ECON: Gifted ${amt} B$ to ${target}.`);
            alert("Currency Granted.");
        }
    }

    function broadcast() {
        const m = document.getElementById('alert-msg').value;
        localStorage.setItem("globalAlert", m);
        log(`BROADCAST: ${m}`);
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    window.onload = () => log("Admin Console Authorized.");
</script>

</body>
</html>
