<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Master Control</title>
    <script>
        if (localStorage.getItem("isAdmin") !== "true") window.location.replace("index.html");
    </script>
    <style>
        :root {
            --admin-dark: #2c3e50;
            --admin-blue: #3498db;
            --admin-red: #e74c3c;
            --admin-green: #27ae60;
        }

        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; }
        
        .banner-container { background: #fff; border-bottom: 2px solid #000; height: 100px; cursor: pointer; }
        .banner-img { width: 100%; }

        .sub-nav { 
            background: var(--admin-dark); color: white; padding: 10px; 
            font-size: 11px; font-weight: bold; border-bottom: 2px solid #000;
        }
        .sub-nav a { color: #72fb3c; text-decoration: none; margin-right: 15px; }

        /* ACCORDION STYLING */
        .admin-section {
            background: #f0f0f0;
            border: 1px solid #a4a4a4;
            margin: 15px 0;
            text-align: left;
        }

        .dropdown-header {
            background: #e9e9e9;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #a4a4a4;
            user-select: none;
        }

        .dropdown-header:hover { background: #ddd; }

        .content {
            display: none; /* Hidden by default */
            padding: 15px;
            background: #fff;
        }

        .content.active { display: block; }

        /* UI ELEMENTS */
        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 4px; color: #555; }
        input, textarea, select { width: 98%; padding: 5px; margin-bottom: 12px; border: 1px solid #ccc; font-family: Verdana; }
        .btn { padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid #333; }
        .btn-save { background: var(--admin-green); color: white; }
        .btn-danger { background: var(--admin-red); color: white; }
        
        .console-log {
            background: #000; color: #00ff00; font-family: monospace;
            height: 80px; overflow-y: scroll; padding: 5px; font-size: 10px; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="banner-container" onclick="window.location.href='index.html'">
            <img src="Banner.png" class="banner-img">
        </div>

        <div class="sub-nav">
            <a href="index.html">← PUBLIC SITE</a>
            SYSTEM CONSOLE [VER 4.2] | LOGGED IN AS MASTER_ROOT
        </div>

        <div style="padding: 0 20px;">
            
            <div class="admin-section">
                <div class="dropdown-header" onclick="toggleSection(this)">
                    👤 USER MANAGEMENT & BANNING <span>[+]</span>
                </div>
                <div class="content">
                    <label>Username to Target</label>
                    <input type="text" placeholder="e.g. Guest_4922">
                    <label>Action</label>
                    <select>
                        <option>Warn User</option>
                        <option>Kick from Server</option>
                        <option>7-Day Ban</option>
                        <option>Terminate Account (IP BAN)</option>
                    </select>
                    <button class="btn btn-danger" onclick="log('Security Action Applied to User.')">EXECUTE PENALTY</button>
                </div>
            </div>

            <div class="admin-section">
                <div class="dropdown-header" onclick="toggleSection(this)">
                    🎨 ASSET CREATOR (MARKETPLACE TOOLS) <span>[+]</span>
                </div>
                <div class="content">
                    <label>Item Name</label>
                    <input type="text" id="asset-name" placeholder="Cool Admin Hat">
                    <label>Item Price (B$)</label>
                    <input type="number" id="asset-price" placeholder="100">
                    <label>Texture/Image Filename</label>
                    <input type="text" id="asset-img" placeholder="AdminHat.png">
                    <button class="btn btn-save" onclick="log('Asset Uploaded to Catalog.')">PUBLISH TO MARKETPLACE</button>
                </div>
            </div>

            <div class="admin-section">
                <div class="dropdown-header" onclick="toggleSection(this)">
                    💰 ECONOMY & STATS OVERRIDE <span>[+]</span>
                </div>
                <div class="content">
                    <label>Set My B$ Balance</label>
                    <input type="number" id="bux-val" placeholder="Current: 100,000,000">
                    <button class="btn btn-save" onclick="updateBux()">APPLY WEALTH</button>
                    
                    <div style="margin-top:15px; border-top: 1px solid #eee; padding-top:10px;">
                        <label>Featured Game Name (Home Page)</label>
                        <input type="text" id="feat-title-in">
                        <button class="btn btn-save" onclick="saveContent()">UPDATE HOME CONTENT</button>
                    </div>
                </div>
            </div>

            <div class="admin-section">
                <div class="dropdown-header" onclick="toggleSection(this)">
                    🚨 SYSTEM ALERTS & BROADCASTS <span>[+]</span>
                </div>
                <div class="content">
                    <label>Global Broadcast Message</label>
                    <textarea id="alert-in" placeholder="Enter message for all users..."></textarea>
                    <button class="btn btn-danger" style="background:orange;" onclick="setAlert()">BROADCAST TO SITE</button>
                    
                    <button class="btn btn-danger" style="margin-top:20px; width:100%;" onclick="wipeData()">WIPE LOCAL DATABASE</button>
                </div>
            </div>

            <div class="console-log" id="logs">
                [SYSTEM] Ready...<br>
                [SYSTEM] Admin Session Authorized...<br>
            </div>
        </div>
    </div>

    <script>
        function toggleSection(header) {
            const content = header.nextElementSibling;
            const span = header.querySelector('span');
            
            // Toggle active class
            content.classList.toggle('active');
            
            // Toggle [+] and [-]
            if(content.classList.contains('active')) {
                span.innerText = "[-]";
                header.style.background = "#d0d0d0";
            } else {
                span.innerText = "[+]";
                header.style.background = "#e9e9e9";
            }
        }

        function log(msg) {
            const div = document.getElementById('logs');
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            div.innerHTML += `[${time}] ${msg}<br>`;
            div.scrollTop = div.scrollHeight;
        }

        function updateBux() {
            const val = document.getElementById('bux-val').value;
            if(!val) return;
            localStorage.setItem("blypoBux", val);
            log(`Balance updated to ${val} B$`);
            alert("Economy Synced!");
        }

        function setAlert() {
            const msg = document.getElementById('alert-in').value;
            localStorage.setItem("globalAlert", msg);
            log(`Global Broadcast queued: ${msg}`);
            alert("Broadcast will show on next page load!");
        }

        function saveContent() {
            localStorage.setItem("admin_featGame", document.getElementById('feat-title-in').value);
            log("Home page featured game updated.");
            alert("Home Content Saved!");
        }

        function wipeData() {
            if(confirm("DANGER: This wipes everything!")) {
                localStorage.clear();
                location.reload();
            }
        }

        // Load existing values
        window.onload = function() {
            document.getElementById('feat-title-in').value = localStorage.getItem("admin_featGame") || "Frozen Peak Obby";
        }
    </script>
</body>
</html>
