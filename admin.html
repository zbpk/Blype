<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Admin</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana'; }
        .wrapper { width: 800px; margin: 20px auto; background: #f0f0f0; border: 1px solid #000; padding: 20px; }
        .header { background: #8a49a8; color: white; padding: 10px; margin: -20px -20px 20px -20px; font-weight: bold; }
        input { margin-bottom: 10px; width: 100%; }
        button { cursor: pointer; font-weight: bold; background: #eee; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">SYSTEM ADMINISTRATION</div>
    <label>Set Admin Blypo-Bux:</label><br>
    <input type="number" id="nbux" placeholder="e.g. 5000000000"><br>
    <button onclick="setBux()">Update Balance</button>
    <p><a href="index.html">← Back Home</a></p>
</div>
<script>
    function setBux() {
        localStorage.setItem("blypoBux", document.getElementById('nbux').value);
        alert("Blypo-Bux set! Refresh home to see K/M/B formatting.");
    }
</script>
</body>
</html>
