<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - Character</title>
    <style>
        body { background: #ade8ff; font-family: 'Verdana', sans-serif; margin: 0; padding: 0; }
        .site-wrapper { width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; border: 1px solid #000; }
        
        /* HEADER */
        .header { background: #8a49a8; color: white; padding: 15px; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; }
        .nav { background: #eee; padding: 10px; font-size: 11px; border-bottom: 1px solid #ccc; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; }

        .content-layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; padding: 20px; }

        /* AVATAR PREVIEW */
        .avatar-box { border: 1px solid #ccc; background: #f9f9f9; padding: 10px; text-align: center; }
        .avatar-display { 
            width: 300px; height: 350px; background: #fff; border: 1px inset #eee; 
            margin: 0 auto; position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-display img { max-width: 90%; }

        /* INVENTORY GRID */
        .inventory-box { border: 1px solid #ccc; padding: 15px; }
        .inventory-tabs { display: flex; gap: 5px; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .tab { font-size: 11px; cursor: pointer; padding: 5px; background: #eee; border-radius: 3px; }
        .tab.active { background: #8a49a8; color: white; }

        .item-grid { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; 
            height: 400px; overflow-y: auto; align-content: start;
        }
        .item-card { 
            border: 1px solid #eee; padding: 10px; text-align: center; font-size: 10px; cursor: pointer;
        }
        .item-card:hover { border-color: #8a49a8; background: #fcfaff; }
        .item-card img { width: 60px; height: 60px; display: block; margin: 0 auto 5px; }
        .wearing-tag { color: green; font-weight: bold; font-size: 9px; }

        .stats-footer { font-size: 11px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="header">
            <span>CHARACTER CUSTOMIZER</span>
            <span id="user-bux" style="font-size: 12px;">B$: 0</span>
        </div>
        <div class="nav">
            <a href="index.html">Home</a> | <a href="marketplace.html">Marketplace</a> | <a href="character.html"><b>Character</b></a> | <a href="admin.html">Admin</a>
        </div>

        <div class="content-layout">
            <div class="avatar-box">
                <div class="avatar-display" id="avatar-render">
                    <img src="https://via.placeholder.com/200x300?text=Base+Character" alt="Avatar">
                </div>
                <button style="margin-top:10px; width:100%; cursor:pointer;" onclick="location.reload()">Refresh Avatar</button>
            </div>

            <div class="inventory-box">
                <div class="inventory-tabs">
                    <div class="tab active">All Assets</div>
                    <div class="tab">Shirts</div>
                    <div class="tab">Hats</div>
                    <div class="tab">Faces</div>
                </div>
                <div class="item-grid" id="inventory-list">
                    </div>
                <div class="stats-footer">
                    Total Items: <span id="item-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BLYPE = {
            session: localStorage.getItem("currentUser"),
            db: JSON.parse(localStorage.getItem("blypo_users") || "{}")
        };

        function loadCharacter() {
            if (!BLYPE.session) {
                document.body.innerHTML = "<h1>Please log in to customize your character.</h1>";
                return;
            }

            const userData = BLYPE.db[BLYPE.session];
            document.getElementById('user-bux').innerText = "B$: " + (userData.bux || 0).toLocaleString();

            const listDiv = document.getElementById('inventory-list');
            listDiv.innerHTML = "";

            // Check if user has items
            if (!userData.inventory || userData.inventory.length === 0) {
                listDiv.innerHTML = "<p style='grid-column: span 3; color:#999;'>You don't own any items yet.</p>";
                return;
            }

            // Fill Inventory from "Database"
            userData.inventory.forEach(itemName => {
                const card = document.createElement('div');
                card.className = "item-card";
                
                // Set item image (Uses your logic: Item Name + Front.png)
                const imgName = itemName.replace(/\s+/g, '') + "Front.png";
                
                card.innerHTML = `
                    <img src="${imgName}" onerror="this.src='https://via.placeholder.com/60/ccc/fff?text=Item'">
                    <b>${itemName}</b><br>
                    <button onclick="wearItem('${itemName}')" style="font-size:9px; margin-top:5px; cursor:pointer;">Wear</button>
                `;
                listDiv.appendChild(card);
            });

            document.getElementById('item-count').innerText = userData.inventory.length;
        }

        function wearItem(name) {
            // This is where you would handle layering the image on the avatar
            alert("Now wearing: " + name);
            // In a real live system, you'd save users[name].currentlyWearing = name;
        }

        // Listen for Admin injections (if Admin adds an item while this tab is open)
        window.addEventListener('storage', (e) => {
            if (e.key === 'blypo_users') {
                BLYPE.db = JSON.parse(e.newValue);
                loadCharacter();
            }
        });

        window.onload = loadCharacter;
    </script>
</body>
</html>
