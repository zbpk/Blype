<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BLYPEME - My Character</title>
    <style>
        body {
            background: #ade8ff;
            font-family: 'Verdana', sans-serif;
            margin: 0; padding: 0;
            text-align: center;
        }

        .site-wrapper { width: 900px; margin: 0 auto; background-color: transparent; }

        /* UNIFIED HEADER */
        .banner-container { background: #fff; border-bottom: 1px solid #000; width: 900px; height: 100px; overflow: hidden; cursor: pointer; }
        .banner-img { width: 100%; }

        .sub-nav {
            background-color: #8a49a8;
            padding: 8px 0;
            color: white;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid #000;
        }
        .sub-nav a { color: white; text-decoration: none; margin: 0 10px; }
        .sub-nav a:hover { text-decoration: underline; }

        /* MAIN GRID */
        .main-container {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 15px;
            padding: 20px 0;
            text-align: left;
        }

        .box { 
            background: #f0f0f0; 
            border: 1px solid #a4a4a4; 
            margin-bottom: 15px; 
            padding: 10px;
            font-size: 11px;
        }
        .box-header {
            background: #e9e9e9;
            border-bottom: 1px solid #a4a4a4;
            padding: 4px;
            font-weight: bold;
            margin: -10px -10px 10px -10px;
            color: #333;
        }

        /* AVATAR DISPLAY */
        .avatar-preview {
            width: 100%;
            height: 250px;
            background: #fff;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            position: relative;
        }
        .avatar-mannequin { font-size: 50px; color: #ddd; }
        .equipped-label { font-size: 10px; color: #8a49a8; font-weight: bold; margin-top: 5px; }

        /* INVENTORY GRID */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .inventory-item {
            background: #fff;
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .btn-wear {
            background: #72fb3c;
            border: 1px solid #27ae60;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .btn-remove {
            background: #ff4d4d;
            color: white;
            border: 1px solid #900;
        }
    </style>
</head>
<body>

    <div class="site-wrapper">
        <div class="banner-container" onclick="window.location.href='index.html'">
            <img src="Banner.png" alt="BLYPE" class="banner-img">
        </div>

        <div class="sub-nav" id="main-nav">
            <a href="index.html">Home</a> | 
            <a href="games.html">Games</a> | 
            <a href="marketplace.html">Marketplace</a> | 
            <a href="character.html">Character</a> | 
            <a href="forum.html">Forum</a> | 
            <a href="help.html">Help</a>
        </div>

        <div class="main-container">
            <aside>
                <div class="box">
                    <div class="box-header">Character Preview</div>
                    <div class="avatar-preview" id="preview-area">
                        <div class="avatar-mannequin">👤</div>
                        <div id="wearing-status" class="equipped-label">Wearing: Nothing</div>
                    </div>
                    <button class="btn-wear btn-remove" onclick="unequipAll()">Unequip All</button>
                </div>

                <div class="box">
                    <div class="box-header">Account Stats</div>
                    Balance: <b style="color:green;">B$ <span id="user-bux">0</span></b><br>
                    Items Owned: <b id="item-count">0</b>
                </div>
            </aside>

            <main>
                <div class="box">
                    <div class="box-header">My Wardrobe</div>
                    <p style="font-size: 10px; color: #666;">Select an item to wear it on your avatar.</p>
                    <div class="inventory-grid" id="inv-grid">
                        </div>
                    <div id="no-items" style="display:none; text-align:center; padding: 20px; color: #999;">
                        Your wardrobe is empty!<br>
                        <a href="marketplace.html" style="color:blue;">Visit the Marketplace</a>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // --- SMART FORMATTING ---
        function formatBux(num) {
            num = parseInt(num);
            if (num >= 1e12) return (num / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        function loadCharacter() {
            const isAdmin = localStorage.getItem("isAdmin") === "true";
            
            // Admin Tab Check
            if(isAdmin) {
                const nav = document.getElementById('main-nav');
                if(!nav.innerHTML.includes("admin.html")) nav.innerHTML += ' | <a href="admin.html" style="color:yellow;">Admin Panel</a>';
            }

            // Stats Update
            document.getElementById('user-bux').innerText = formatBux(localStorage.getItem("blypoBux") || 0);

            // Load Inventory
            const owned = JSON.parse(localStorage.getItem("ownedItems") || "[]");
            const grid = document.getElementById('inv-grid');
            document.getElementById('item-count').innerText = owned.length;

            if (owned.length === 0) {
                document.getElementById('no-items').style.display = "block";
            } else {
                grid.innerHTML = "";
                owned.forEach(item => {
                    grid.innerHTML += `
                        <div class="inventory-item">
                            <b>${item.name}</b><br>
                            <button class="btn-wear" onclick="equip('${item.name}')">Wear</button>
                        </div>
                    `;
                });
            }

            // Load currently wearing
            const current = localStorage.getItem("equippedItem") || "Nothing";
            document.getElementById('wearing-status').innerText = "Wearing: " + current;
        }

        function equip(name) {
            localStorage.setItem("equippedItem", name);
            document.getElementById('wearing-status').innerText = "Wearing: " + name;
            alert("Equipped: " + name);
        }

        function unequipAll() {
            localStorage.removeItem("equippedItem");
            document.getElementById('wearing-status').innerText = "Wearing: Nothing";
        }

        window.onload = loadCharacter;
    </script>
</body>
</html>
